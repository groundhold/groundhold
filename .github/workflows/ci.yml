# The project gate on every PR and push (D25): vet + BOTH conformance suites
# (Go runtime + Python reference) must pass. "Conformance is the source of
# truth" — no contribution merges until it proves it against the suite, in both
# implementations. Hermetic: no cloud credentials, no network beyond the action
# runners (the runtime itself makes zero network calls here).
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum

      # The reference implementation is Python 3.12, stdlib + PyYAML only.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the one Python dependency (PyYAML)
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Gate (make check — vet + Go and Python conformance + differential-safe)
        run: make check

      # Seeded cross-implementation fuzzing (D38): random docs through both
      # CLIs must agree. A robustness gate on top of the fixed conformance set.
      - name: Differential (cross-impl fuzz)
        run: make differential

      # Coverage of the Go runtime — reported, not yet gated on a threshold.
      - name: Coverage
        working-directory: go
        run: |
          go test -coverprofile=cover.out ./... >/dev/null
          go tool cover -func=cover.out | tail -1

  # The race detector: the runtime is concurrency-heavy (lease acquisition, the
  # ledger, the scenario engine). Kept as its own job so a data race is a distinct,
  # legible failure rather than hidden in the gate.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: go test -race
        run: make race

  # Portability, linux half: builds and tests on the self-hosted fleet, every time.
  # Go-only (no Python) — the conformance source-of-truth still runs in `gate`.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: build + test
        working-directory: go
        run: go build ./... && go test ./...

  # Portability, darwin/arm64: the release cross-builds it and nothing else tests it,
  # so macos-latest (arm64) exercises the exact platform that only ever compiled.
  #
  # This is the ONLY job in the repository that still runs on GitHub-hosted minutes,
  # and macOS bills at a 10x multiplier — there is no self-hosted darwin. Running it
  # on every push to every branch made it the single largest line in this repo's CI
  # bill for a check that guards a RELEASE artifact. It now runs when something lands
  # on the default branch: a pull request that breaks darwin is caught at merge,
  # before any tag.
  #
  # NOT on tags, whatever an earlier version of this comment claimed — `on:` above
  # has no `tags:` filter, so a release tag never reaches this job. The default
  # branch is the only place darwin is ever exercised.
  #
  # It is currently FAILING, and honestly: with the organisation's Actions budget at
  # 100% no hosted runner can be acquired, so the job dies at assignment with zero
  # steps and an empty runner name. darwin/arm64 is therefore UNVERIFIED, and the
  # release still cross-builds it. That red is not papered over — restoring it is a
  # billing decision, not a code change.
  portability-darwin:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: build + test
        working-directory: go
        run: go build ./... && go test ./...

  # go.mod/go.sum stay minimal and correct: a drift (a stray require, a mislabeled
  # // indirect) fails here instead of rotting.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: go mod tidy is a no-op
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go mod verify
        working-directory: go
        run: go mod verify
