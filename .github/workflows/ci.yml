# The project gate on every PR and push (D25): vet + BOTH conformance suites
# (Go runtime + Python reference) must pass. "Conformance is the source of
# truth" — no contribution merges until it proves it against the suite, in both
# implementations. Hermetic: no cloud credentials, no network beyond the action
# runners (the runtime itself makes zero network calls here).
name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum

      # The reference implementation is Python 3.12, stdlib + PyYAML only.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the one Python dependency (PyYAML)
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Gate (make check — vet + Go and Python conformance + differential-safe)
        run: make check

      # Seeded cross-implementation fuzzing (D38): random docs through both
      # CLIs must agree. A robustness gate on top of the fixed conformance set.
      - name: Differential (cross-impl fuzz)
        run: make differential

      # Coverage of the Go runtime — reported, not yet gated on a threshold.
      - name: Coverage
        working-directory: go
        run: |
          go test -coverprofile=cover.out ./... >/dev/null
          go tool cover -func=cover.out | tail -1

  # The race detector: the runtime is concurrency-heavy (lease acquisition, the
  # ledger, the scenario engine). Kept as its own job so a data race is a distinct,
  # legible failure rather than hidden in the gate.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: go test -race
        run: make race

  # Portability, linux half: builds and tests on the self-hosted fleet, every time.
  # Go-only (no Python) — the conformance source-of-truth still runs in `gate`.
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: build + test
        working-directory: go
        run: go build ./... && go test ./...
      # D386: darwin/arm64 COMPILES here, on a linux runner, and that is all this
      # step claims. It is not a test — nothing is executed, no behaviour is
      # observed. It exists because the darwin TEST now runs downstream (see
      # below), and a compile break caught at merge beats the same break caught at
      # the next sync. Cheap, and honest about being the lesser check.
      - name: darwin/arm64 cross-compiles
        working-directory: go
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build ./... && go vet ./...

  # Portability, darwin/arm64: the release cross-builds it, so something has to
  # actually RUN it. macos-latest (arm64) exercises the exact platform that would
  # otherwise only ever have compiled.
  #
  # D386: it runs on the PUBLIC MIRROR ONLY, and the condition says so literally.
  # There is no self-hosted darwin, this repository's organisation has stopped
  # buying GitHub-hosted minutes, and the mirror's Actions budget is separate and
  # healthy — the job passes there today, on this same code, with real steps.
  #
  # DELETING the job would have been the obvious way to honour "everything
  # self-hosted", and it would have been wrong: the mirror's ci.yml is EXPORTED
  # FROM THIS FILE, so removing the job here removes darwin coverage from the only
  # place it still works. The `if` keeps one definition running in exactly the one
  # repository that can run it.
  #
  # THE COST, stated: a darwin break is now caught at the next sync rather than at
  # merge into this repository. The cross-compile step above narrows that window to
  # breaks that compile but misbehave — it does not close it.
  #
  # NOT on tags, whatever an earlier version of this comment claimed — `on:` above
  # has no `tags:` filter, so a release tag never reaches this job.
  portability-darwin:
    if: github.event_name == 'push' && github.repository_owner == 'groundhold'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: build + test
        working-directory: go
        run: go build ./... && go test ./...

  # go.mod/go.sum stay minimal and correct: a drift (a stray require, a mislabeled
  # // indirect) fails here instead of rotting.
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache-dependency-path: go/go.sum
      - name: go mod tidy is a no-op
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go mod verify
        working-directory: go
        run: go mod verify
