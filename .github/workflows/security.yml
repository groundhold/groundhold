# Security gates for the runtime: known-vulnerability scan + gosec/staticcheck
# linting + secret scanning (all blocking). Deep dataflow SAST lives in
# codeql.yml. DAST does not apply — the runtime is a CLI/library, not a web
# service (that belongs to the console repo).
name: security

on:
  pull_request:
  push:
    branches: [main, master]
    # D626: a tag is the one event that ships something to a user, and it used to
    # trigger release.yml alone — so this check never ran on the code being released.
    tags: ['v*']
  schedule:
    - cron: "0 6 * * 1" # weekly — catch newly-published advisories

permissions:
  contents: read

jobs:
  govulncheck:
    # Blocking: fails the build if the code path calls a known-vulnerable
    # symbol (stdlib or dependency). The toolchain is pinned in go/go.mod.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: govulncheck
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  golangci-lint:
    # Blocking: gosec + staticcheck + the default set (errcheck, unused,
    # ineffassign, gosimple, govet). The backlog was triaged and cleared; every
    # remaining exclusion is documented in go/.golangci.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v9 of the action installs from the /v2 module path, so the pinned
          # version must be a v2 release — a v1 tag simply does not exist there,
          # which is why the bare action bump failed to install anything (D380).
          version: v2.6.2
          # goinstall builds golangci-lint with the runner's Go (1.26.6); the prebuilt
          # binary is compiled with go1.24 and refuses a module targeting a newer Go.
          install-mode: goinstall
          working-directory: go
          args: --timeout=5m

  gitleaks:
    # Blocking: secret scanning across the whole tree. Fake credentials in test
    # fixtures and spec examples are allowlisted in .gitleaks.toml (each entry
    # names why it is not a live secret); a real key committed anywhere else
    # fails the build. gitleaks exits non-zero when it finds a leak.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

  # D479: a pin is only as good as the hash somebody wrote down. The make-check gate
  # proves every action is a 40-character SHA, that the same action carries the same
  # pin everywhere, and that each pin says which tag it claims to be (`# v1.2.3`).
  # None of that proves the hash IS that tag's commit — the threat model listed it as
  # an accepted risk, and this closes it.
  #
  # Scheduled, not blocking on pull requests, and that is deliberate. Upstream tags
  # MOVE (a v6 retagged onto a new commit is routine), so a mismatch is not necessarily
  # a compromise — it is an event somebody must look at. Failing the security schedule
  # surfaces it; failing every PR would train people to ignore it.
  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Re-resolve every pinned tag and compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The list goes to a FILE and the loop reads the file. Piping into `while`
          # runs the loop in a subshell, where the failure flag cannot escape — a job
          # that reports success no matter what it found, which is the failure mode
          # this whole session keeps finding in other people's gates and which the
          # first draft of this one had.
          grep -rhoE "uses:[[:space:]]+[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}[[:space:]]*#[[:space:]]*v[^[:space:]]+" \
            .github/workflows/*.yml \
            | sed -E 's|uses:[[:space:]]+||; s|@| |; s|[[:space:]]*#[[:space:]]*| |' \
            | sort -u > /tmp/pins.txt
          n=$(wc -l < /tmp/pins.txt)
          if [ "$n" -lt 5 ]; then
            echo "only $n pins found — this job would be vacuous" >&2
            exit 1
          fi
          fail=0
          while read -r repo sha tag; do
            typ=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.type' 2>/dev/null || true)
            obj=$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)
            if [ "$typ" = "tag" ] && [ -n "$obj" ]; then
              obj=$(gh api "repos/$repo/git/tags/$obj" --jq '.object.sha' 2>/dev/null || true)
            fi
            if [ -z "$obj" ]; then
              echo "UNRESOLVED $repo@$tag — the tag is gone or renamed" >&2; fail=1
            elif [ "$obj" != "$sha" ]; then
              echo "MOVED $repo@$tag pinned=$sha now=$obj" >&2; fail=1
            else
              echo "ok $repo@$tag"
            fi
          done < /tmp/pins.txt
          echo "checked $n pins"
          exit "$fail"
