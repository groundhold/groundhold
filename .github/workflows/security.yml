# Security gates for the runtime: known-vulnerability scan + gosec/staticcheck
# linting + secret scanning (all blocking). Deep dataflow SAST lives in
# codeql.yml. DAST does not apply — the runtime is a CLI/library, not a web
# service (that belongs to the console repo).
name: security

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1" # weekly — catch newly-published advisories

permissions:
  contents: read

jobs:
  govulncheck:
    # Blocking: fails the build if the code path calls a known-vulnerable
    # symbol (stdlib or dependency). The toolchain is pinned in go/go.mod.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - name: govulncheck
        working-directory: go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  golangci-lint:
    # Blocking: gosec + staticcheck + the default set (errcheck, unused,
    # ineffassign, gosimple, govet). The backlog was triaged and cleared; every
    # remaining exclusion is documented in go/.golangci.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
      - uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6.1.1
        with:
          version: v1.64.8
          # goinstall builds golangci-lint with the runner's Go (1.26.5); the prebuilt
          # binary is compiled with go1.24 and refuses a module targeting a newer Go.
          install-mode: goinstall
          working-directory: go
          args: --timeout=5m

  gitleaks:
    # Blocking: secret scanning across the whole tree. Fake credentials in test
    # fixtures and spec examples are allowlisted in .gitleaks.toml (each entry
    # names why it is not a live secret); a real key committed anywhere else
    # fails the build. gitleaks exits non-zero when it finds a leak.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
