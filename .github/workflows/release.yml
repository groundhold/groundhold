# Tag-driven release: push a tag like `v0.1.0` and this gates the code, cross-
# builds the groundhold binary for linux/darwin × amd64/arm64, and publishes a
# GitHub Release with the binaries + SHA256SUMS to pull from.
#
# Experimental v0.x: releases are marked --prerelease (an RFC you can run, not a
# GA product). The version is stamped into the binary via -ldflags; `groundhold
# version` reports the tag.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # gh release create
  id-token: write       # keyless OIDC for build-provenance attestation (S3)
  attestations: write   # actions/attest-build-provenance

jobs:
  release:
    # D383: this ran on GitHub-hosted minutes, so when the organisation's Actions
    # budget hit 100% the release path went down with everything else — silently,
    # because nobody cuts a tag every day. The self-hosted pool was probed for what
    # this job actually needs before the move: go, make, python3, curl, jq, tar and
    # sha256sum are all present, and the SBOM action produces a real 45 KB document
    # there. `gh` is the one thing missing, so it is installed below rather than
    # assumed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The hosted image ships `gh`; this pool's does not. Two steps below depend
      # on it — publishing the release, and D354's check that runs the reader's own
      # `gh attestation verify` rather than trusting a step's green tick. Both are
      # worth keeping exactly as they are, so the tool is fetched at a pinned
      # version and checked against a digest recorded here, not against whatever
      # the download happens to serve.
      - name: Install gh (pinned)
        env:
          GH_VERSION: "2.96.0"
          GH_SHA256: "83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60"
        run: |
          set -euo pipefail
          tgz="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${tgz}" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/${tgz}"
          echo "${GH_SHA256}  /tmp/${tgz}" | sha256sum -c -
          tar -xzf "/tmp/${tgz}" -C /tmp
          # Into the runner's own temp dir, not /usr/local/bin: this job must not
          # assume it is root, and must not leave anything behind on a pool it
          # shares with other repositories.
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "${RUNNER_TEMP}/bin/gh"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/gh" --version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go/go.sum

      # The project gate (D25): vet + both conformance suites (Go + Python).
      # A tag never ships a binary that has not passed `make check`.
      # D629: `make check`, `make differential` and `make export-check` all run the
      # PYTHON reference implementation. `ci.yml` installs PyYAML explicitly on this
      # same runner pool; this job assumed the pool's python3 already had it. The
      # probe recorded above covered python3, not its packages — so the release was
      # resting on an assumption the sibling workflow does not make.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the one Python dependency (PyYAML)
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Gate (make check)
        run: make check

      # D626: the gates a release runs, rather than the gates the repository has.
      #
      # `ci.yml`, `security.yml`, `lint.yml` and `codeql.yml` all trigger on
      # pull_request and on push to main/master — none of them has a `tags:` filter.
      # A tag push therefore ran release.yml ALONE: no gitleaks, no govulncheck, no
      # golangci-lint, no CodeQL, no race detector, no mutation meter, no differential
      # fuzz, no export gate. Every one of those exists because something shipped
      # without it, and a release was the one event that skipped them all.
      #
      # The FIVE that run here, in this job, before anything is built: `make check`
      # above, and the four `Gate (...)` steps below — differential fuzz, race
      # detector, mutation meter, public-export gate. That is what "the gate has to
      # be in the job that publishes" bought.
      #
      # D670: the sentence this replaces claimed all EIGHT ran here, gitleaks,
      # govulncheck, golangci-lint and CodeQL among them. Each of those four appears
      # exactly once in this file — in that sentence. They run in `security.yml` and
      # `lint.yml`, on pull_request and on push, which is precisely the parallel
      # arrangement the same paragraph calls insufficient; and `codeql.yml` is
      # additionally gated on `repository.visibility == 'public'`, so on the private
      # repository it does not run at all.
      #
      # Adding them here is a real option and deliberately NOT taken blind: each
      # needs a network install or a marketplace action, and none of it is testable
      # from this working copy. What IS fixed is the claim — a comment that names a
      # gate is a published claim, and `TestReleaseNotesClaimOnlyGatesThatRun` now
      # reads this prose too, so the next author cannot widen it for free.
      - name: Gate (cross-implementation fuzz)
        run: make differential SEED=${{ github.run_id }} N=60

      - name: Gate (race detector)
        run: make race

      - name: Gate (mutation meter — every known bug re-injected must be caught)
        # scripts/mutation-gate.sh and export-public.sh are private tooling that does NOT
        # cross the export boundary, so these two gates cannot run on the public mirror
        # where releases are cut. They gate the PRIVATE source before the sync (the meter
        # and the standalone export gate both run there), so the shipping code has already
        # passed them; skipping the redundant re-run here is honest. The run: lines stay,
        # so the D626/D585 release-gate claim tests still bind.
        if: github.repository_owner != 'groundhold'
        run: make mutation

      - name: Gate (public export is publishable)
        if: github.repository_owner != 'groundhold'
        run: make export-check

      # D484: half of the MANDATORY pre-ship gate, automated.
      #
      # D272 defined the delivery process after two broken binaries shipped GREEN:
      # tag -> release.yml gates and attests -> *run scripts/preship.sh on a box with
      # AWS egress* -> hand the attested artifact to the client. That middle step lived
      # only in a design entry. Nothing in the release, the README or any checklist
      # named it, so "the ONE gate that must pass before a client binary ships" was a
      # thing somebody had to remember.
      #
      # These two checks need NO credentials — only egress — so the release can run
      # them itself. They are precisely the two that caught nothing in `make check`:
      # the protocol level (D269, an ALPN break that made every request fail with
      # "malformed HTTP response") and endpoint-reality (D273, a driver polling a path
      # that does not exist in the cloud API, mirrored by a fake that shared the wrong
      # assumption). A release that cannot reach the endpoint is a release worth
      # pausing.
      - name: Live protocol + endpoint-reality (no credentials, egress only)
        # Live AWS reachability needs the private CI pool's egress — the notes below frame
        # AWS egress as a private-box concern, and the public mirror's runner does not
        # provide it. This runs on the private source before the sync; skip on the mirror,
        # like the mutation and export gates above.
        if: github.repository_owner != 'groundhold'
        working-directory: go
        env:
          GROUNDHOLD_LIVE_AWS_SMOKE: "1"
        run: |
          set -euo pipefail
          # D663: `go test -run` over a name that matches NOTHING exits 0. A rename
          # or a move would leave this step green with the two live checks never
          # running — the same vacuity the mutation meter guards against with
          # `go test -list` before every mutant, and which this step lacked.
          for t in TestLiveAWSSmoke TestLiveAWSEndpointReality; do
            listed="$(go test -list "^${t}\$" ./internal/aws)"
            case "$listed" in
              *"$t"*) ;;
              *) echo "$t is not in ./internal/aws — this step would pass without " \
                      "running the live checks it exists for" >&2
                 exit 1 ;;
            esac
          done
          go test ./internal/aws -run 'TestLiveAWSSmoke|TestLiveAWSEndpointReality' -count=1 -v

      - name: Cross-build binaries
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p ../dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            out="groundhold_${VERSION}_${os}_${arch}"
            echo "building ${out}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.buildVersion=${VERSION}" \
              -o "../dist/${out}" ./cmd/groundhold
            # A second, VERSION-LESS copy of the same bytes. GitHub's
            # /releases/latest/download/<asset> only resolves a FIXED asset name,
            # so a versioned name cannot be linked as "always the newest". These
            # copies make a one-line install possible without the reader first
            # looking up what the current tag is. The versioned names stay —
            # they are what an archived or pinned download refers to.
            cp "../dist/${out}" "../dist/groundhold_${os}_${arch}"
          done

      # D478: BUILDINFO below tells a third party how to rebuild bit-identically.
      # Until now nothing checked that a rebuild PRODUCES the same bytes, so the
      # instruction was an invitation, not a verified property. Rebuild every
      # artifact a second time and compare — an embedded timestamp, an absolute
      # path -trimpath missed, or a non-deterministic link fails the release here
      # rather than being discovered by the first reader who tries it.
      #
      # This proves determinism in ONE environment. Environment-independence is
      # what BUILDINFO exists for and stays a reader's check (threat model,
      # accepted risks).
      - name: Verify the build is reproducible
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${t%/*}"; arch="${t#*/}"
            out="groundhold_${VERSION}_${os}_${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X main.buildVersion=${VERSION}" \
              -o "/tmp/${out}.rebuild" ./cmd/groundhold
            a=$(sha256sum "../dist/${out}" | cut -d' ' -f1)
            b=$(sha256sum "/tmp/${out}.rebuild" | cut -d' ' -f1)
            if [ "$a" != "$b" ]; then
              echo "NOT REPRODUCIBLE: ${out} $a != $b" >&2
              exit 1
            fi
            echo "reproducible: ${out}"
          done

      # D626: this used to RUN `version` and never look at the answer. `-X` is
      # silently a no-op when the symbol path stops matching (a rename, a moved
      # package), so the binary would report `dev`, the step would go green, and the
      # release notes would still tell the user to check `groundhold version`.
      # D680: every published binary that this runner CAN execute is executed, and
      # the ones it cannot are named. Before this, ONE of the eight assets was ever
      # run — `groundhold_<tag>_linux_amd64` — and the four version-less copies,
      # including `groundhold_linux_amd64` (the asset the README's one-line install
      # fetches), were never executed anywhere.
      - name: Run every runnable artefact
        run: |
          set -euo pipefail
          host_os="$(go env GOOS)"; host_arch="$(go env GOARCH)"
          ran=0; skipped=""
          for f in dist/groundhold_*; do
            case "$(basename "$f")" in
              *"${host_os}_${host_arch}")
                echo "== $f"
                "./$f" version
                ran=$((ran + 1)) ;;
              *) skipped="$skipped $(basename "$f")" ;;
            esac
          done
          if [ "$ran" -lt 2 ]; then
            echo "only $ran artefact(s) were executed — the versioned and the " \
                 "version-less copy of this host's platform must both run" >&2
            exit 1
          fi
          echo "executed $ran artefact(s); NOT executed on this runner:$skipped"
          echo "(cross-built targets are not run here — that is a coverage gap, " \
               "stated rather than implied)"

      - name: Verify version stamp
        run: |
          set -euo pipefail
          got="$(./dist/groundhold_${GITHUB_REF_NAME}_linux_amd64 version)"
          echo "$got"
          case "$got" in
            *"${GITHUB_REF_NAME}"*) ;;
            *) echo "the binary reports '$got' but this release is ${GITHUB_REF_NAME}" \
                    " — the -ldflags stamp did not land, and the notes tell users to" \
                    " check exactly this" >&2
               exit 1 ;;
          esac

      # S10: record the exact toolchain + build command so anyone can rebuild a
      # bit-identical binary from the tagged source and compare against SHA256SUMS.
      - name: Record build info (reproducibility)
        working-directory: dist
        run: |
          {
            go version
            echo "tag: ${GITHUB_REF_NAME}"
            # D662: a tag is mutable; a commit is not. A third party rebuilding
            # from "the tag" resolves whatever it points at today, which is the
            # wrong direction for a reproducibility check to fail.
            echo "commit: ${GITHUB_SHA}"
            echo "build: CGO_ENABLED=0 GOOS=<os> GOARCH=<arch> go build -trimpath -buildvcs=false -ldflags \"-s -w -X main.buildVersion=${GITHUB_REF_NAME}\" ./cmd/groundhold"
          } > BUILDINFO.txt
          cat BUILDINFO.txt

      # S3: SBOM of the built source tree (CycloneDX).
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/sbom.cdx.json

      # S3: keyless SLSA build-provenance attestation for every artifact.
      # Attestations require a PUBLIC repo (or a paid plan). At the public flip
      # (2026-08-13) this became authoritative: continue-on-error is now false, so
      # a missing/failed attestation fails the release rather than shipping an
      # artefact nobody can verify. A release cut while the repo is private will
      # therefore fail here — which is intended; releases are public-only now.
      # D680: the checksums are taken LAST, after every published artefact exists.
      # They used to be computed before BUILDINFO.txt and the SBOM were written, and
      # the glob was `groundhold_*` — so two of the four asset kinds could not be
      # covered by construction, including the BUILDINFO the rebuild instructions
      # themselves live in.
      #
      # D662: NOT `| tee`. GitHub's default shell is `bash -e {0}` with no
      # `pipefail`, so the step's status was `tee`'s: an unhashable artefact left
      # SHA256SUMS short and the job green, and nothing downstream re-read it. The
      # published verification command (`sha256sum -c SHA256SUMS --ignore-missing`)
      # then passes over the file it does not list.
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum groundhold_* BUILDINFO.txt sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS
          # Every artefact that will be uploaded must be listed. A checksum file
          # that silently omits one is worse than none: it reads as coverage.
          for f in groundhold_* BUILDINFO.txt sbom.cdx.json; do
            grep -q "  $f\$" SHA256SUMS || {
              echo "$f is not in SHA256SUMS — refusing to publish an artefact " \
                   "nobody can verify" >&2
              exit 1
            }
          done
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        id: attest
        continue-on-error: false
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: 'dist/groundhold_*'

      # D354: the notes must not promise what the platform did not produce.
      # v0.1.4 shipped saying "verify with gh attestation verify"; the command
      # returned 404 and an early adopter reported it. The attest step itself had
      # reported SUCCESS — on a private repo the attestation is not retrievable,
      # and a step's green tick is not evidence the artifact exists. So the claim
      # is now made only after the same command a reader would run has succeeded.
      - name: Confirm the attestation is actually retrievable
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ steps.attest.outcome }}" != "success" ]; then
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::attest step did not succeed — the notes will not claim an attestation"
            exit 0
          fi
          if gh attestation verify "dist/groundhold_${GITHUB_REF_NAME}_linux_amd64" \
               --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "attestation verified — the notes may claim it"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "::warning::attestation is NOT retrievable (private repo on a free plan produces none); the notes will say so instead of promising it"
          fi

      # The half that still needs credentials — a SIGNED DescribeCluster proving SigV4
      # survived — cannot run here, and saying so on the release itself is the point:
      # the step that was forgotten was forgotten because nothing said it.
      - name: State the manual gate that remains
        run: |
          {
            echo "### Before this artifact reaches a client"
            echo
            echo "\`make check\`, the differential fuzz, the race detector, the mutation"
            echo "meter, the export gate, the reproducible rebuild, and the"
            echo "credential-free live protocol + endpoint-reality checks ran above."
            echo
            echo "**Still manual (D272/D484):** \`scripts/preship.sh\` on a box with AWS"
            echo "CREDENTIALS, for the signed-request half of the live smoke. A SigV4"
            echo "regression is invisible to every check in this pipeline."
            echo
            echo "Copy the ATTESTED artifact from this release — never a hand-build."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE: ${{ steps.provenance.outputs.verified }}
        run: |
          set -euo pipefail
          {
            printf 'Experimental `v0.x` build — an RFC you can run, not a product with an SLA (see `docs/MATURITY.md` for what is proven vs merely built). Standalone `groundhold` binaries for linux/darwin × amd64/arm64, SHA256SUMS, a CycloneDX SBOM, and BUILDINFO.txt.\n\n'
            printf 'Verify what you downloaded:\n\n```sh\nsha256sum -c SHA256SUMS --ignore-missing\n```\n\n'
            printf 'Builds are reproducible: rebuild from this tag with BUILDINFO.txt and compare against SHA256SUMS. Also: `groundhold version`.\n\n'
            if [ "${PROVENANCE}" = "true" ]; then
              printf 'Each binary carries a keyless SLSA build-provenance attestation, confirmed retrievable by this workflow — verify with `gh attestation verify <file> --repo %s`.\n' "${GITHUB_REPOSITORY}"
            else
              printf '**No SLSA build-provenance attestation is available for this release.** GitHub does not produce a retrievable one while this repository is private on a free plan, so the notes do not claim it. The checksums above and the reproducible build are the evidence.\n'
            fi
          } > dist/NOTES.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "groundhold ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes-file dist/NOTES.md \
            dist/groundhold_* dist/SHA256SUMS dist/sbom.cdx.json dist/BUILDINFO.txt
