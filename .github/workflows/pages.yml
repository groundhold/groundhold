# Deploy the mkdocs documentation site (website/) to GitHub Pages.
#
# Deploys on every docs change to the default branch, and on demand.
#
# It used to be manual-only, with a comment explaining why: Pages on a free org needs
# a PUBLIC repository, and this one was private. That stopped being true at the launch
# and the workflow did not notice — so for three days the site served a tree older than
# main, and a page merged into the repository was simply not there. The document that
# described the dormancy also prescribed the fix ("add a push trigger"), which is the
# tell: a condition that expires should carry the change it licenses, not a note asking
# someone to remember (D1084).
#
# The path filter is deliberate. `website/**` is what mkdocs builds; a deploy on every
# unrelated commit would republish an identical site and make a real docs deploy
# impossible to spot in the run history.
name: pages

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # D383/D1084: the push trigger below makes this fire on an ordinary commit, and
    # the site is served from the mirror — so on the private source it would spend the
    # organisation's hosted minutes to build a page nobody can reach. The org's Actions
    # budget hitting 100% is not hypothetical; it took the release path down once.
    if: github.repository_owner == 'groundhold'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the docs toolchain
        run: pip install -r website/requirements.txt
      - name: Build (strict — a broken link or nav entry fails)
        working-directory: website
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/site

  deploy:
    needs: build
    # D383/D1084: the push trigger below makes this fire on an ordinary commit, and
    # the site is served from the mirror — so on the private source it would spend the
    # organisation's hosted minutes to build a page nobody can reach. The org's Actions
    # budget hitting 100% is not hypothetical; it took the release path down once.
    if: github.repository_owner == 'groundhold'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
