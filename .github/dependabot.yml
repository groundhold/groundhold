# Dependabot: keep the (minimal) dependency surface and the CI actions
# current. Security updates land as PRs that must pass `make check` (D25).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/website" # the mkdocs docs toolchain (website/requirements.txt)
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
