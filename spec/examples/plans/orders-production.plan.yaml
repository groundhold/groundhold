apiVersion: plan/v0
kind: SealedPlan

# What a compiler emits after verification passes. The reads block pins
# the ACTUAL hashes of the example contract and candidate in this repo —
# `groundhold hash` on those files reproduces them (D28, D36).

plan:
  contract: orders-production
  environment: production

  reads:
    contractHash: "sha256:e39bbba5bef27992f1e3609b5388eb435150f17f744031d21856a4037c23de96"
    candidateHash: "sha256:62e9bcae17cec6827c9fea8209a927c3b822636316ecbd6147aad60b66f60568"
    heads:
      orders-db: genesis
    vocabularies:
      capability.database.relational: "0.1"
    toolchain:
      compiler: groundhold-go/0.1.0
      spec: contract/v0.1
    pricingCatalog: gcp-eu-2026-07
    provider:
      name: gcp
      project: acme-prod
      region: europe-west1

  writes: [orders-db]

  actions:
    - id: a-create-primary
      capability: orders-db
      operation: create
      target: cloudsql.instance/primary
      idempotencyKey: orders-db-create-7f3a
      dependsOn: []
      requiredPermissions:                 # D75
        - cloudsql.instances.create
        - cloudsql.instances.get
      risk:
        reversibility: R2
        dataLoss: none
        downtime: none
        securityExposure: none
        costDelta: { amount: 912, currency: EUR }
        identityReplacement: false
    - id: a-configure-pitr
      capability: orders-db
      operation: update
      target: cloudsql.instance/primary
      idempotencyKey: orders-db-pitr-7f3a
      dependsOn: [a-create-primary]
      # D46: an update is a REVIEWED change-set, never an implicit diff. The
      # executor patches the listed paths from the hash-pinned candidate; from/to
      # are denormalized audit fields. This action is what makes c-rpo (<= 5m)
      # reachable — point-in-time recovery is off on a fresh instance.
      changes:
        - { path: recovery.rpo, from: 24h, to: 5m }
      requiredPermissions:                 # D75
        - cloudsql.instances.get
        - cloudsql.instances.update
      risk:
        reversibility: R1
        dataLoss: none
        downtime: none
        securityExposure: none
        costDelta: { amount: 0, currency: EUR }
        identityReplacement: false

  preconditions:
    - type: report-executable
    - type: within-autonomy
