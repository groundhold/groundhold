# Attribute vocabulary for capability.storage.object, spec v0.1 (D60).
# What an organization can REQUIRE of an object store: durability,
# retention, exposure, residency. Bucket names, storage-class knobs and
# lifecycle rule syntax are implementation noise.

capability: capability.storage.object
version: 0.1
stateful: true   # objects ARE the data; retirement is data loss

attributes:

  location.region:
    kind: string
    description: Primary region of the bucket/container
    mappings:
      gcp.gcs: bucket location
      aws.s3: region
      # D545: read from the driver.
      azure.blob: the storage account location

  durability.class:
    kind: string
    enum: [single-zone, regional, multi-regional]
    description: Physical redundancy of stored objects
    mappings:
      gcp.gcs: location type (region/dual-region/multi-region)
      aws.s3: storage class redundancy
      azure.blob: >
        from the account SKU replication suffix: LRS is single-zone, ZRS/GRS regional,
        RA-GZRS and the geo pairs multi-regional

  versioning.enabled:
    kind: bool
    description: Object versions survive overwrites and deletes
    mappings:
      gcp.gcs: versioning.enabled
      aws.s3: versioning status
    recommended:
      op: equals
      value: true
      scope: all
      rationale: "Enable object versioning so an accidental overwrite or delete can be recovered."
      ruleId: PV_R0006
      ruleVersion: 1
      controls:
        FSBP: ["S3.14"]
        CIS-AWS_5.0.0: ["2.1.3"]

  retention.minimum:
    kind: duration
    description: >
      Objects cannot be deleted before this age (compliance hold)
    mappings:
      gcp.gcs: retentionPolicy.retentionPeriod
      aws.s3: >
        Object Lock DefaultRetention, honored AT BIRTH (create-time). The bucket
        is created object-lock-enabled (x-amz-bucket-object-lock-enabled) and a
        PutObjectLockConfiguration sets DefaultRetention.Days (duration rounded to
        whole days). Mode is GOVERNANCE (a bypassable floor) unless retention.locked
        is true. PRESUPPOSES versioning.enabled (S3 only retention-protects versioned
        objects). Create-time-only: a change is a bucket replacement.

  retention.maximum:
    kind: duration
    description: >
      Objects must NOT outlive this age — data minimization (GDPR-style
      "delete after N"). The exact dual of retention.minimum: a ceiling,
      not a floor. Fulfilled by a lifecycle expiration rule, NOT object
      CRUD (the rule is the capability, individual objects are not).
    mappings:
      gcp.gcs: lifecycle rule action=Delete condition.age (days)
      aws.s3: lifecycle rule Expiration.Days

  retention.maximumByPrefix:
    kind: list
    unordered: true
    evidence: resource
    # A SET of per-key-class expiration ceilings, each encoded `<prefix>=<N>d`
    # (whole days, canonical). The per-prefix twin of retention.maximum: some data
    # classes in one bucket are kept longer than others (an ephemeral ingress prefix
    # vs a retention prefix), which a single bucket-wide ceiling cannot express.
    description: >
      Per-prefix expiration ceilings — the SET of `<prefix>=<days>d` rules on this bucket,
      the EFFECT (which key-class is kept how long), not the lifecycle document. Each element
      is a lifecycle Expiration on a PURE prefix filter; observe includes a rule ONLY when it
      is Enabled, has an Expiration in whole DAYS (not a Date, not a noncurrent-version rule),
      and filters by prefix ALONE — a Disabled rule, a tag/AND filter, or a version-scoped
      rule is EXCLUDED (it does not produce the per-prefix current-object effect the attribute
      asserts), so a declared element then reads as missing and a hard `equals` goes RED rather
      than green over a rule that does not do what it looks like. An empty list is MEASURED
      absence (no qualifying rule), never unknown. The observed days are the EFFECTIVE
      retention, not a rule read alone: S3 applies the EARLIEST matching expiration, so for
      each prefix observe emits the MINIMUM over every rule whose prefix is a prefix of it — the
      bucket-wide rule and any shorter overlapping prefix rule — never the raw rule days that a
      shorter rule silently shadows (D1178). `cors.allowedOrigins`-style: the observed
      value is that effective per-prefix days, so `retention.maximumByPrefix equals ["ingress/=1d",
      "retain/=365d"]` blocks the tester's blind promotion (a missing, shortened, disabled, or
      wrongly-filtered retain/ rule) AND catches an out-of-band rule (an extra element) — with
      no verifier change. Two build-time coherence refusals, because S3 applies the EARLIEST
      matching expiration: a per-prefix ceiling must be <= any declared bucket-wide
      retention.maximum (a longer one is silently unhonored), and >= any declared
      retention.minimum/locked (a lifecycle rule must not undercut an Object-Lock floor). The
      lifecycle DOCUMENT (transitions, header/tag filters, noncurrent-version expiry) stays
      implementation noise; a future implementation.lifecycle operand with a projection gate is
      the door left open. The ULTIMATE per-object check, past rule-level projection, is a probe
      of S3's resolved `x-amz-expiration` — complementary, not this attribute.
    mappings:
      aws.s3: lifecycle rules with a pure-prefix Filter and Expiration.Days (PUT/GetBucketLifecycleConfiguration)
      gcp.gcs: lifecycle rules action=Delete, condition.age + matchesPrefix (one rule, N prefixes -> N elements)
      azure.blob: management policy filters.prefixMatch + baseBlob delete daysAfterModification — ACCOUNT-scoped (honored with that caveat, like cors)

  retention.locked:
    kind: bool
    description: >
      WORM: the retention period cannot be shortened or removed, even by an
      admin (a one-way compliance lock). PRESUPPOSES retention.minimum — you
      cannot lock nothing. Honoring it is a create-time, irreversible lock of
      the SAME bucket resource.
    mappings:
      gcp.gcs: retentionPolicy.isLocked (buckets.lockRetentionPolicy)
      aws.s3: >
        Object Lock retention Mode, honored AT BIRTH. true => COMPLIANCE (a hard
        WORM no principal — not even the account root — can shorten or remove);
        false/unset => GOVERNANCE (a floor overridable with
        s3:BypassGovernanceRetention). PRESUPPOSES retention.minimum (you cannot
        lock nothing) and versioning.enabled. Object Lock is enabled at CreateBucket
        (create-time-only, irreversible), so a change is a bucket replacement.

  network.publicExposure:
    kind: bool
    description: >
      Whether the object store grants any ANONYMOUS (unauthenticated) access path to its
      data, using the provider's own meaning of "public": on AWS, a public bucket policy
      OR a bucket ACL granting AllUsers / AuthenticatedUsers at ANY permission (a public
      write is an exposure too). This is the SAME question on every cloud (D1198): the
      GDPR/data-exposure intent of the control, NOT network reachability — an object store
      is typically always network-reachable, and access is governed by whether the data
      can be read without credentials. Not read-only: it is the configuration publicness
      the cited controls (FSBP S3.2, CIS 2.1.5) enforce.
    mappings:
      gcp.gcs: iamConfiguration.publicAccessPrevention + IAM bindings
      aws.s3: bucket policy status + effective Block Public Access + bucket ACL
      azure.blob: >
        allowBlobPublicAccess on the storage account AND the container's publicAccess
        (Blob/Container = anonymous, None = private) — the account flag is the twin of an
        S3 Block Public Access (false blocks all anonymous access account-wide), the
        container level is the per-container grant. D1198 (owner decision) reads THIS, the
        anonymous-access question, not publicNetworkAccess (network reachability, which
        the other Azure drivers still map for capabilities that have no anonymous-access
        concept) — so the attribute means one thing across clouds within this capability.
    note: >
      Static verification proves configuration intent at BUCKET scope, and only
      when BOTH the policy and the bucket ACL read definitively — either unreadable
      without the other proving public WITHHOLDS the verdict (a false negative is
      the dangerous direction, never fabricated). Two residuals it cannot see from
      bucket-level reads, disclosed rather than hidden: per-object ACLs (an
      individually-public object under a private bucket policy and ACL — closed by
      an enforced IgnorePublicAcls, which neutralizes public object ACLs) and S3
      Access Point policies (a same-account access point with its own public policy).
      An outcome probe (anonymous GET attempt) proves the actual absence of public
      reads and closes both residuals.
    recommended:
      op: equals
      value: false
      scope: all
      rationale: "Block public access to object storage; publicly readable buckets are a leading cause of data exposure."
      ruleId: PV_R0005
      ruleVersion: 1
      controls:
        FSBP: ["S3.2"]
        CIS-AWS_5.0.0: ["2.1.5"]
        GDPR: ["Art.32"]

  replication.enabled:
    kind: bool
    description: >
      Objects are asynchronously replicated to a bucket in ANOTHER region — a
      cross-region DR / multi-region durability layer. PRESUPPOSES
      versioning.enabled (CRR only replicates versioned objects), the same way
      retention.locked presupposes retention.minimum. The replica bucket is a
      SEPARATE capability.storage.object instance in the other region; its ARN
      and the replication IAM role are implementation detail
      (implementation.replication_destination_bucket_arn /
      implementation.replication_role_arn), never capability paths.
    mappings:
      gcp.gcs: not honored — GCS has no native cross-region async replica of a
        chosen second region (dual/multi-region is a durability.class, not a
        replica you point at a region); probe-only
      aws.s3: bucket replication configuration (PutBucketReplication)

  replication.destinationRegion:
    kind: string
    description: >
      The region replicas land in — the SUBSTANCE of DR data residency.
      Asserted against an EU allowlist with the membership operator (`in`), the
      SAME closed-set pattern as the Bedrock D1 residency rule. OBSERVED, never
      declared on faith: an S3 replication rule holds its destination as an
      arn:aws:s3:::<bucket> ARN, which carries NO region, so the driver measures
      it with GetBucketLocation on the destination bucket (residency measured,
      not theatre). Meaningful only when replication.enabled is true.
    mappings:
      gcp.gcs: n/a (see replication.enabled)
      aws.s3: GetBucketLocation on the replication destination bucket

  encryption.atRest:
    description: >-
      Whether objects are encrypted on disk. Every managed object store here encrypts by default, so `false` is refused rather than pretended; customer-managed keys are a separate attribute
    kind: bool
    mappings:
      gcp.gcs: always true (CMEK optional)
      aws.s3: default encryption
      azure.blob: const true — Azure Storage encrypts at rest unconditionally

  encryption.customerManagedKeys:
    kind: bool
    description: >
      Objects are encrypted with a CUSTOMER-managed key (CMEK/KMS), not
      merely the provider's default key. The key id itself is implementation
      detail (implementation.kms_key_name / implementation.kms_key_id),
      never a capability path. The provider-default key does NOT satisfy this.
    mappings:
      gcp.gcs: encryption.defaultKmsKeyName
      aws.s3: ServerSideEncryptionConfiguration SSE-KMS with a customer key
    recommended:
      op: equals
      value: true
      scope: prod
      rationale: "In production, encrypt objects with a customer-managed key so key rotation and revocation are yours to control."
      ruleId: PV_R0007
      ruleVersion: 1
      controls:
        FSBP: ["S3.17"]
        GDPR: ["Art.32"]
        ISO27001_2022: ["A.8.24"]

  service.managed:
    kind: bool
    description: Managed service vs self-operated

  cost.monthly:
    description: >-
      Projected monthly cost of the bucket — a projection over declared size and class, never a quote and never read back from the provider (evidence: projection)
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    verification: static against a pricing catalog; billing after deploy

  cors.allowedOrigins:
    kind: list
    evidence: resource
    description: >
      The SET of browser origins that have a cross-origin rule on this bucket — the UNION of
      AllowedOrigins across all CORS rules (`"*"` recorded literally), sorted-unique like every
      list here. This is the EFFECT (who may call from a browser), NOT the rule document: the
      origin-by-method pairing and the header/max-age detail live in `implementation.cors`,
      which the verify projection gate requires to agree with this set. An empty list is a
      MEASURED absence (GetBucketCors returned no configuration), never unknown — so a bucket a
      browser upload needs, but which has no rule, reads as `[]`, and a hard
      `cors.allowedOrigins equals ["https://app.example.com"]` blocks it: converge stays red
      until the rule lands, and a rule drifted to `"*"` or an extra origin is caught too,
      with no verifier change. Undeclared means the surface is UNMANAGED (no rule written,
      none removed — a brownfield bucket's CORS is not stomped). Whether a specific METHOD is
      actually allowed is an OUTCOME a probe proves (a preflight OPTIONS), not this attribute —
      a flat origin set cannot express origin-by-method without claiming more than it enforces.
    mappings:
      aws.s3: union of CORSConfiguration CORSRule[].AllowedOrigins (PutBucketCors / GetBucketCors)
      gcp.gcs: union of cors[].origin
      azure.blob: CORS is set at the STORAGE ACCOUNT level, not the container — honored with that caveat

# Deliberately absent in v0.1 (implementation noise):
# bucket names, storage-class tiers, lifecycle rule syntax, signed-URL
# mechanics. The CORS rule DOCUMENT — the origin-by-method pairing, headers,
# max-age — is `implementation.cors`, not a capability path; its EFFECT, which
# origins may call cross-origin, IS a capability (cors.allowedOrigins above).
