# Attribute vocabulary for capability.workload.container, spec v0.1
# (D60). What an organization can REQUIRE of a containerized workload:
# availability, exposure, supply-chain provenance, capacity FLOOR.
# Image tags, pod templates and orchestrator flags are implementation
# noise.
#
# First STATELESS vocabulary: a workload's instances are replaceable by
# definition — retirement destroys no data, so delete_stateful gates do
# not bind it and replacement needs no allow_replace_stateful consent.
#
# One capability TYPE, MANY services (D76): cloudrun, gke, cloudfunctions
# (Gen2) all fulfil this — a function's source/runtime/no-image shape is
# implementation noise; what an org contracts (residency, exposure,
# capacity floor, TLS, cost) is identical. cloudfunctions v0 handles
# HTTP-invoked functions; an event-driven trigger is candidate wiring, not
# a contract attribute (the driver refuses it, fail-closed, until an
# eventing capability is decided on its own merits — a future
# invocation.protocol attribute if that need ever appears).

capability: capability.workload.container
version: 0.1
stateful: false

attributes:

  location.region:
    kind: string
    description: Primary region the workload runs in
    mappings:
      gcp.cloudrun: service region
      gcp.cloudfunctions: function location
      aws.ecs: region
      aws.apprunner: region
      azure.containerapps: the resource `location`, lower-cased

  availability.class:
    description: >-
      How much of a failure the workload survives: `zonal` runs in one availability zone, `regional` spreads across several. It is about placement, not about replica count, which is an implementation operand
    kind: string
    enum: [zonal, regional, multi-regional]
    mappings:
      gcp.cloudrun: regional by construction
      gcp.cloudfunctions: regional by construction
      aws.ecs: regional by construction (a service spans the cluster's subnets)
      aws.apprunner: regional by construction (App Runner has no zonal placement)
      azure.containerapps: zonal — a Container Apps environment is placed in one
        zone unless zone redundancy is enabled on the environment, which this
        capability does not configure

  network.publicExposure:
    kind: bool
    description: Whether the workload is reachable from the internet
    mappings:
      gcp.cloudrun: ingress setting + IAM invoker
      gcp.cloudfunctions: ingressSettings + invoker IAM on the backing Run service
      aws.apprunner: NetworkConfiguration.IngressConfiguration.IsPubliclyAccessible
      aws.ecs: awsvpcConfiguration.assignPublicIp == ENABLED — a task with a public
        IP is reachable from the internet; this is the network placement, not an
        authorization check
      azure.containerapps: >
        configuration.ingress.external — Container Apps decides internet
        reachability with that one flag (no separate anonymous-invoke grant the
        way Lambda and Cloud Run have). Absent ingress means not exposed. Note
        this attribute is "reachable from the internet", NOT "unauthenticated":
        Easy Auth in front of an external ingress does not make it false (D538)

  replicas.minimum:
    kind: number
    description: >
      Capacity floor — the number of instances that must exist even at
      zero load (cold-start and availability semantics)
    mappings:
      gcp.cloudrun: minInstances
      gcp.cloudfunctions: serviceConfig.minInstanceCount
      aws.apprunner: AutoScalingConfiguration MinSize (>=1; no scale-to-zero)
      aws.ecs: desiredCount (omitted when 0 — a service scaled to zero declares no
        minimum rather than claiming one of zero)
      azure.containerapps: template.scale.minReplicas (omitted when unset — Container
        Apps then applies its own default rather than a declared floor)

  autoscaling.enabled:
    description: >-
      Whether the platform adds and removes instances on load by itself. The thresholds and bounds are implementation operands (D26); this says only whether the behaviour is on
    kind: bool
    mappings:
      gcp.cloudrun: always true (maxInstances bounds it)
      gcp.cloudfunctions: always true (maxInstanceCount bounds it)
      aws.apprunner: always true (AutoScalingConfiguration MaxSize bounds it)

  image.signedProvenance:
    kind: bool
    description: >
      Only images with verified build provenance (signature/attestation)
      may run — supply-chain gate
    mappings:
      gcp.cloudrun: Binary Authorization policy
    note: >
      static verification proves the POLICY exists; an outcome probe
      (attempt to deploy an unsigned image into a scratch revision)
      proves it bites.

  tls.enforced:
    kind: bool
    description: Plaintext ingress is refused
    mappings:
      gcp.cloudrun: HTTPS-only by construction
      gcp.cloudfunctions: HTTPS-only by construction
      aws.apprunner: HTTPS-only by construction (managed endpoint)
      aws.ecs: the HTTPS/TLS listener of the load balancer fronting the service —
        traced targetGroupArn -> DescribeTargetGroups -> DescribeListeners. A service
        behind no load balancer has no front door to measure and the attribute is not
        emitted (a diagnostic says the trace failed rather than assuming plaintext)
      azure.containerapps: NOT configuration.ingress.allowInsecure — the ingress
        accepts plaintext only when that flag is set, so TLS is enforced when it is
        false. An app with no ingress has no front door and the attribute is not
        emitted

  service.managed:
    kind: bool
    description: Managed runtime vs self-operated cluster

  cost.monthly:
    description: >-
      Projected monthly cost of the workload — a projection over the declared shape, never a quote and never read back from the provider (evidence: projection)
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    verification: static against a pricing catalog; billing after deploy

# Deliberately absent in v0.1 (implementation noise):
# image tags/digests (the digest is the CANDIDATE's business), pod
# templates, orchestrator flags, sidecar shapes, service mesh wiring,
# cpu/memory requests (capacity tuning, not capability semantics).

# NOT an implementation of this capability, deliberately recorded (D552).
# capability.workload.container previously named `gcp.gke` on seven attributes. No
# service measures them: the driver reports gke -> capability.cluster.kubernetes, and
# observeGKE emits only cluster attributes. The lines described what a
# containers-on-GKE mapping WOULD look like, sitting in the block that states what a
# driver DOES measure — indistinguishable from the backed lines beside them. The
# design intent is kept here, out of `mappings:`, where nothing reads it as a claim:
#
#   gcp.gke: cluster location
#   gcp.gke: cluster topology
#   gcp.gke: Service/Ingress type
#   gcp.gke: HPA minReplicas
#   gcp.gke: HPA present
#   gcp.gke: Binary Authorization
#   gcp.gke: Ingress TLS + redirect
#
# Wiring it would mean a service that reverse-maps a Deployment + HPA + Ingress into
# this capability. GKE's own cluster attributes are mapped, accurately and in more
# detail, in capability.cluster.kubernetes.
