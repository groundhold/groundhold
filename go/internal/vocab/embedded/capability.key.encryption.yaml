# Attribute vocabulary for capability.key.encryption, spec v0.1 (D102).
#
# A managed CRYPTOGRAPHIC KEY for encryption — the 3-cloud twin is GCP Cloud KMS,
# AWS KMS, and Azure Key Vault keys. It is the deliberate COUNTERPOINT to
# capability.secret (D97): a secret's rotation was REFUSED because rotation is the
# credential PRODUCER's job, not the store's — but a KMS key's rotation IS the
# store's managed property. The service generates the key material, holds it in an
# HSM/vault it never exports, and rotates it on a schedule the service enforces. So
# rotation.period is HONORED here, where it was refused there — same word, opposite
# and honest treatment, because the thing rotating is different (managed key
# material vs an out-of-band credential value).
#
# The key material itself is NEVER a declared attribute (it is never exported —
# that is the whole point of a KMS key). v0 is the common case: a SYMMETRIC
# encryption key (the CMK other capabilities reference). Asymmetric / signing keys
# and per-version lifecycle are deferred.

capability: capability.key.encryption
version: 0.1
stateful: true   # a key protects data; destroying it makes everything it
                 # encrypted UNRECOVERABLE — the sharpest data loss there is, so
                 # destroy-scheduling/protection and delete friction apply (D47).

attributes:

  location.region:
    kind: string
    description: Region the key (and its HSM/vault) resides in — residency.
    mappings:
      gcp.cloudkms: the keyRing location
      aws.kms: derived from the provider region
      azure.keyvaultkey: the containing vault's location

  rotation.period:
    kind: duration
    description: >
      Interval at which the SERVICE automatically rotates the key material. This
      is the honest inverse of capability.secret, where rotation was refused: for
      a managed key the store owns rotation, so a duration here is a real,
      verifiable configuration, not a claim.
    mappings:
      gcp.cloudkms: cryptoKey.rotationPeriod (+ nextRotationTime)
      aws.kms: automatic key rotation with RotationPeriodInDays (symmetric only)
      azure.keyvaultkey: the key rotation policy (lifetimeAction timeAfterCreate)
    recommended:
      op: lte
      value: 8760h
      scope: all
      rationale: "Rotate key material at least annually so the blast radius of a key compromise stays bounded."
      ruleId: PV_R0015
      ruleVersion: 1
      controls:
        CIS-AWS_5.0.0: ["3.8"]

  rotation.enabled:
    kind: bool
    description: >
      Whether the service's automatic key rotation is turned ON at all. This is
      the precondition rotation.period presupposes: a period is meaningless on a
      key that does not rotate, so a key with rotation OFF cannot honor a
      rotation.period contract, and observing it silently absent (rather than a
      measured false) would let an adopt bind a non-rotating key as if it rotated.
    mappings:
      gcp.cloudkms: a cryptoKey with a rotationPeriod set (rotation scheduled)
      aws.kms: GetKeyRotationStatus KeyRotationEnabled
      azure.keyvaultkey: the key rotation policy has an active lifetimeAction

  protection.level:
    kind: string
    enum: [software, hsm]
    description: >
      Where the key material is protected. hsm = a hardware security module
      (FIPS-validated); software = software-protected. Mapped honestly per cloud;
      AWS KMS is always HSM-backed, so software is refused there, not faked.
    mappings:
      gcp.cloudkms: cryptoKeyVersion protectionLevel (SOFTWARE / HSM)
      aws.kms: always HSM-backed (software => REFUSED, cannot downgrade)
      azure.keyvaultkey: vault SKU standard (software) vs premium/Managed HSM (hsm)

  service.managed:
    kind: bool
    description: Managed service vs self-operated

  cost.monthly:
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    description: >
      Projected monthly cost (per active key + per HSM, if any). Usage
      (crypto operations) is billed after deploy.
    verification: static against a pricing catalog; billing after deploy

# Deliberately absent in v0.1 — never a declaration, or deferred:
#   - the KEY MATERIAL / export: a KMS key is never exported (that is its purpose);
#     declaring key bytes is a category error, like a secret's value or a zone's
#     records.
#   - key VERSIONS / the primary version: lifecycle state, not a declared input
#     (rotation.period governs how versions are created).
#   - purpose / algorithm / key size: v0 is a SYMMETRIC ENCRYPTION key (the CMK
#     case). Asymmetric and signing keys, and key size, are sizing/kind detail —
#     deferred; a future purpose enum (encrypt | sign) would add them honestly.
#   - IAM / who-may-use-the-key: authorization, a different capability.
#   - destruction friction (scheduled-destroy window): a delete-time policy, not a
#     stored property — deferred, never a ledger promise (as with the secret).
