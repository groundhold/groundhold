# Attribute vocabulary for capability.security.threatdetection, spec v0.1 (D154).
#
# Continuous threat detection as a GOVERNED capability — the security posture of a
# platform, not a deployment of an application (author-vs-witness: this is the
# security SUBSTRATE groundhold provisions once per region, alongside VPC/CloudTrail,
# never an app the platform hosts). Acme §7 requires it explicitly: "GuardDuty +
# EKS Protection" — the detector ON per region, with Kubernetes audit-log
# monitoring for the EKS control plane.
#
# What an organization GOVERNS (semantic, verifiable, org-required):
#   - WHERE the detector runs (location.region — the service is per-region;
#     detection in eu-central-1 says nothing about eu-west-1),
#   - WHETHER detection is on at all (detection.enabled — the core switch),
#   - the PROTECTION surface it covers (protection.kubernetes for EKS audit-log
#     monitoring, protection.malware for EBS malware scanning).
# The finding-publishing FREQUENCY is a tuning OPERAND (impl block, D26 —
# implementation.findingPublishingFrequency), not a governed guarantee: it changes
# how fast findings surface, not whether the posture holds. The findings EXPORT
# destination (an S3/EventBridge sink) is a SEPARATE capability, never wired here.
#
# STATELESS. A detector is a posture SWITCH + configuration, not a data store: it
# holds no durable customer data that a delete would lose. Findings live inside the
# GuardDuty service (ephemeral service state, retained/exported by the service), so
# tearing the detector down is a POSTURE change (detection off), not the loss of a
# store groundhold is responsible for — hence stateful:false (no deletion-protection
# friction, no replace-stateful consent). This mirrors ai.inference / cost.budget.
#
# One TYPE, many services (D76): aws.guardduty today. Singleton per account+region
# (like an SES active rule set) — the driver honest-refuses a second, FOREIGN
# detector rather than pretend it created one it cannot.

capability: capability.security.threatdetection
version: 0.1
stateful: false

# D698: PROTECTION. Deleting this does not remove a resource — it lowers a guard.
# `stateful: false` above is right and says nothing about that: the question it
# answers is whether a delete loses DATA. This repo's rule is that a protection is
# never auto-lifted (D47) — it is why a delete refuses while deletionProtection is on
# — and switching detection off as a side effect of retiring a contract does exactly
# what that rule forbids, with no consent step and no record. Worse, create adopts an
# already-on control silently, so the retirement cannot tell "we enabled this" from
# "it was on before groundhold arrived".
#
# Retirement of a protection capability therefore REFUSES unless the contract scopes
# `autonomy.allow_protection_lift` to it. The alternative needs no flag: drop the
# capability from the contract and groundhold stops asserting it, leaving the control
# ON — `posture` then reports it as unmanaged, which is true.
protection: true

attributes:

  location.region:
    kind: string
    description: The region the detector protects (GuardDuty is per-region — one detector per account per region)
    mappings:
      aws.guardduty: the detector's region (the regional guardduty endpoint)
      # D543: all three report the SENTINEL "global" — threat detection is an
      # account/subscription/project-wide posture, not a regional resource. The
      # sentinel is a contract convention, not a cloud value.
      azure.defender: const "global" — Defender plans are subscription-wide
      gcp.scc: const "global" — SCC services are org/project-wide

  detection.enabled:
    kind: bool
    description: Whether continuous threat detection is ACTIVE — the core posture switch. Assert =true to require the platform's threat detector be on.
    mappings:
      aws.guardduty: get-detector Status == ENABLED
      azure.defender: the VirtualMachines Defender plan priced at Standard
      gcp.scc: the event-threat-detection module's effectiveEnablementState == ENABLED

  protection.kubernetes:
    kind: bool
    description: Whether EKS Protection (Kubernetes audit-log monitoring) is enabled — the control-plane threat surface Acme §7 requires for its EKS substrate.
    mappings:
      aws.guardduty: the EKS_AUDIT_LOGS feature Status == ENABLED
      azure.defender: the Containers Defender plan, found AND priced at Standard
      gcp.scc: container-threat-detection's effectiveEnablementState == ENABLED

  protection.malware:
    kind: bool
    description: Whether Malware Protection (EBS volume scanning on suspicious findings) is enabled — optional deepening of the posture.
    mappings:
      aws.guardduty: the EBS_MALWARE_PROTECTION feature Status == ENABLED
      azure.defender: >
        the Storage Defender plan at Standard AND its malware-scanning extension
        enabled — BOTH, since the plan alone does not scan
      gcp.scc: virtual-machine-threat-detection's effectiveEnablementState == ENABLED

  service.managed:
    kind: bool
    description: Whether groundhold manages this threat-detection configuration
    mappings:
      aws.guardduty: const true when observed through the driver
      azure.defender: const true
      gcp.scc: const true

  cost.monthly:
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    description: Projected monthly cost (GuardDuty bills on analyzed events/logs volume)
    verification: static against a pricing catalog; billing after deploy
