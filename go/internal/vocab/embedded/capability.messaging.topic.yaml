# Attribute vocabulary for capability.messaging.topic, spec v0.1 (D94).
# A fan-out publish address: messages published here reach every attached
# consumer. The topic itself holds nothing the author owns — subscribers own
# their copies — so its vocabulary is thin and honest. Subscriptions, push
# endpoints, filters and fan-out wiring are the CONSUMER's concern (topology),
# never the topic's.
#
# delivery.guarantee is deliberately ABSENT here: a topic's guarantee to its
# subscriptions is always at-least-once on both clouds (a single-valued attribute
# is not an attribute). ordering and retention are absent too — they live on the
# subscription/queue side (Pub/Sub topics carry no ordering promise; SNS standard
# topics retain nothing), so putting them on a topic would be provider-shaped.

capability: capability.messaging.topic
version: 0.1
stateful: true   # Pub/Sub topics can retain; stay conservative (replace = data risk)

attributes:

  encryption.atRest:
    kind: bool
    description: Provider-side encryption of any retained message data. Only true is meaningful.
    mappings:
      aws.sns: server-side encryption (KmsMasterKeyId)
      gcp.pubsub-topic: topic default encryption
      azure.servicebustopic: const true — Service Bus encrypts at rest unconditionally

  encryption.customerManagedKeys:
    kind: bool
    description: >
      Retained message data is encrypted with a CUSTOMER-managed key (CMEK/KMS),
      not the provider default. The key id is implementation detail
      (implementation.kms_key_id / kms_key_name), never a capability path.
    mappings:
      aws.sns: KmsMasterKeyId (a customer key)
      gcp.pubsub-topic: topic kmsKeyName

  location.region:
    kind: string
    description: >
      Where message data is PERSISTED. NOTE gcp.pubsub is global by default — this
      maps to the topic's message storage policy, NOT the API-call region; a
      residency contract "satisfied" by a global topic would be a compliance lie.
    mappings:
      aws.sns: topic region
      gcp.pubsub-topic: messageStoragePolicy.allowedPersistenceRegions
      azure.servicebustopic: the NAMESPACE's location (the entity has none of its own)

  network.publicExposure:
    kind: bool
    description: Whether any public/anonymous publish path exists.
    mappings:
      aws.sns: no Principal:"*" in the topic resource policy
      gcp.pubsub-topic: no allUsers/allAuthenticatedUsers IAM binding
      azure.servicebustopic: >
        the namespace's publicNetworkAccess — Enabled is exposed, Disabled is not.
        Again a namespace property: the queue/topic does not carry one
    note: >
      static verification proves configuration intent; an anonymous-publish probe
      proves the actual absence of a public path.

  service.managed:
    kind: bool
    description: Managed service vs self-operated

  cost.monthly:
    description: >-
      Projected monthly cost of the topic — a projection, never a quote, and never read back from the provider (evidence: projection)
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    verification: static against a pricing catalog; billing after deploy

  delivery.confirmedSubscribers:
    kind: number
    evidence: resource
    description: >
      How many CONFIRMED subscriptions point at the topic — WITNESSED, never set by
      the author (subscribers own their subscriptions; this only COUNTS them). A topic
      with zero is a dummy: an alarm or event fires into it and no one is on the other
      end, while every other attribute reads satisfied. Constrain it
      (delivery.confirmedSubscribers gte 1) to require the topic actually reach a
      consumer, closing the "created but unused" gap. A witness can PROVE ">= N
      confirmed" but NOT "reaches nobody": a 0 read is confounded by a pending
      subscription (whose counter the provider updates only eventually), a cross-account
      subscription, or a delivery path it does not enumerate. So a positive count is
      MEASURED and 0 is UNKNOWN — a hard gte-1 then blocks as unknown, never a false
      violated. What it does NOT assert: that a HUMAN reads what is delivered. "Someone is
      actually told" is not a claim a deterministic witness can make — this is
      delivery-READINESS, not receipt (the alert.notify D1027 discipline, one capability
      over). This is a COUNT, not the cross-capability reference the deferred note below
      still describes.
    mappings:
      aws.sns: GetTopicAttributes SubscriptionsConfirmed (>0 measured; 0 -> unknown, cannot prove reaches-nobody)
      gcp.pubsub-topic: attached subscriptions count (separate slice)

# Deliberately absent in v0.1 (belongs to the consumer/subscription, or noise):
# subscription CONFIG (push endpoint, protocol, filters, raw message delivery,
# fan-out wiring, ordering and retention on the subscription side), topic names.
# delivery.confirmedSubscribers above is a COUNT (a witness of non-vacuity), NOT
# this config. delivery.guarantee: single-valued (at-least-once) here, so not an
# attribute.
#
# Deferred, needs a cross-capability REFERENCE kind: which queues/consumers a topic
# fans out to (that is the consumer declaring a source, not the topic sprouting
# children).
