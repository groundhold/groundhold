# Attribute vocabulary for capability.identity.serviceaccount, spec v0.1 (D121).
#
# A managed MACHINE identity — a non-human principal a workload runs as (or assumes)
# to authenticate to cloud APIs. A genuine THREE-CLOUD twin: GCP service account,
# AWS IAM role, and Azure user-assigned managed identity.
#
# This domain is IDENTITY, not AUTHORIZATION. What the identity may DO (its granted
# roles / attached policies) is a separate concern (the trust policy / role bindings
# are OPAQUE config carried under `implementation:`, invariant #4). This vocabulary
# declares only that a keyless machine identity exists.
#
# D53 (secrets structurally excluded) shapes the one honest boundary: key.exportable
# is BOOL, and true (a downloadable private key) is REFUSED on all three — a private
# key is a secret groundhold must NEVER manage. The keyless path (workload identity /
# an assumed role / a managed identity) is the only one this capability provisions.
#
# NOTE ON THE ENUM-GUARD: a machine identity has no natural closed enum (unlike a
# database's availability class or a WAF's mode). So the two dual conformance cases
# are a full verify plus a KIND-MISMATCH load error (key.exportable declared as a
# non-bool) — the type system is exercised in place of an enum. The enum-guard is a
# convention, not a law; where no honest enum exists, forcing one would be the lie.

capability: capability.identity.serviceaccount
version: 0.1
stateful: false   # an identity holds no data — retirement removes the principal but
                  # loses no records (no D47 data-loss friction). Workloads bound to
                  # it lose their auth, which is a coordination concern, not data.

attributes:

  display.name:
    kind: string
    description: >
      A human-readable name for the identity (the identifier the console shows). The
      machine-facing id/email/ARN is provider-assigned and observed, not requested.
    mappings:
      gcp.serviceaccount: serviceAccount.displayName
      aws.iamrole: the role name / a Name tag
      azure.managedidentity: the identity resource name

  key.exportable:
    kind: bool
    description: >
      Whether the identity has a DOWNLOADABLE long-lived private key. false = keyless
      (GCP workload identity, an AWS assumed role, an Azure managed identity — the
      only path this capability provisions). true is REFUSED on all three: a private
      key is a secret groundhold must never manage (D53). A keyless identity is the
      secure default and the sole honored value.
    mappings:
      gcp.serviceaccount: keyless (no user-managed keys created) — true refused
      aws.iamrole: an assumed role has no exportable key — true refused
      azure.managedidentity: a managed identity has no exportable key — true refused

  service.managed:
    kind: bool
    description: Managed service vs self-operated

  cost.monthly:
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    description: Projected monthly cost of the capability (identities are typically free)
    verification: static against a pricing catalog; provider-api (billing) after deploy

# Deliberately absent in v0.1:
#   - location.region: identities are global/project/account-scoped principals, not
#     regional resources. (An Azure managed identity is technically a regional ARM
#     resource, but its region is topology carried under implementation.location, not
#     a capability attribute — the dns.zone stance.)
#   - the trust policy / assume-role document, attached roles / policy bindings, key
#     rotation: all OPAQUE config under `implementation:` (invariant #4 — what the
#     identity may DO is authorization, a separate capability).
