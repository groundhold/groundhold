# Attribute vocabulary for capability.backup.vault, spec v0.1 (D127).
#
# A managed BACKUP VAULT — the honest 3-cloud twin is AWS Backup, GCP Backup and DR, and
# Azure Backup (a Microsoft.DataProtection backup vault). Unlike the thin vpn/scheduler domains, a backup
# vault has REAL, compliance-grade capability semantics an organization genuinely
# audits: where the recovery points live, how long they are guaranteed to be kept, and
# whether that guarantee is IMMUTABLE (WORM) — the properties a data-retention or
# ransomware-recovery policy is written against. The backup PLANS, schedules and
# resource selections that populate the vault are a separate concern (opaque impl,
# invariant #4); this capability is the vault itself and its retention guarantee.
#
# One honest per-cloud gap and one honest per-cloud requirement:
#  - retention.lockMode=COMPLIANCE is REFUSED on GCP, and D752 turned this paragraph
#    around. It used to say the opposite — that governance was refused because a GCP
#    vault is "immutable by construction, compliance-only" — and Google's own contract
#    disagrees: a backup vault carries an OPTIONAL effectiveTime, "Time after which the
#    BackupVault resource is locked". Until it passes, backupVaults.patch updates the
#    vault's settings and backupVaults.delete with force=true removes it "and any data
#    source from this backup vault". An unlocked vault is admin-changeable, which is
#    governance. This driver sends no effectiveTime, so it BUILDS governance and refuses
#    to promise compliance; observe reads effectiveTime and reports compliance once the
#    lock is genuinely in force.
#
#    Corrected here as well as at the attribute (D330): the same belief was written
#    twice in one file, and fixing one copy left the other publishing the old claim.
#  - retention.minimum is REQUIRED on GCP (the API mandates a minimum enforced
#    retention at create); on AWS a vault can exist without one, honored via a Backup
#    Vault Lock when the contract asks for it. Stated, not smoothed.
#
# retention.lockMode is the domain's natural closed enum (the enum-guard dual case).

capability: capability.backup.vault
version: 0.1
stateful: true   # a vault HOLDS recovery points — destroying it loses the ability to
                 # recover, the sharpest kind of data loss; conservative-honest
                 # retirement (D47), and a compliance-locked vault may refuse deletion
                 # outright until its retention elapses.

attributes:

  location.region:
    kind: string
    description: Region the vault (and its recovery points) live in.
    mappings:
      aws.backupvault: derived from the provider region
      gcp.backupvault: the backup vault location
      azure.backupvault: the backup vault location

  retention.minimum:
    kind: duration
    description: >
      The MINIMUM guaranteed retention of recovery points in the vault — they cannot
      be deleted before this age. Required on GCP (enforced natively); on AWS enforced
      via a Backup Vault Lock's MinRetentionDays.
    mappings:
      gcp.backupvault: backupMinimumEnforcedRetentionDuration (required)
      aws.backupvault: Backup Vault Lock MinRetentionDays
      azure.backupvault: securitySettings.softDeleteSettings.retentionDurationInDays (optional; day-granular)

  retention.lockMode:
    kind: string
    enum: [governance, compliance]
    description: >
      Whether the retention guarantee is admin-changeable (governance) or IMMUTABLE
      (compliance / WORM).

      D752 corrects this description. It said "governance is REFUSED on GCP, whose
      enforced retention is immutable by construction (compliance-only)", and that is
      not what Google's contract says. A Backup and DR vault carries an OPTIONAL
      effectiveTime, "Time after which the BackupVault resource is locked"; until it
      passes, backupVaults.patch updates the vault's settings and backupVaults.delete
      with force=true removes it "and any data source from this backup vault". An
      unlocked GCP vault is admin-changeable, which is precisely governance.
    mappings:
      aws.backupvault: Backup Vault Lock — governance (ChangeableForDays set) vs compliance (immutable)
      gcp.backupvault: effectiveTime — absent or future means governance (patchable,
        force-deletable with its data); past means compliance. This driver creates
        vaults with NO lock time, so it builds governance and refuses to promise
        compliance (D752).
      azure.backupvault: securitySettings.immutabilitySettings.state — Unlocked (governance) vs Locked (compliance); honors BOTH

  encryption.customerManagedKeys:
    kind: bool
    description: >
      Recovery points are encrypted with a CUSTOMER-managed key (CMK/CMEK), not merely
      the provider's default key. The key id is implementation detail
      (implementation.kms_key_arn / implementation.kms_key_name), never a capability path.
    mappings:
      aws.backupvault: EncryptionKeyArn (a customer key)
      gcp.backupvault: CMEK (a customer key)
      azure.backupvault: securitySettings.encryptionSettings + a system-assigned identity (implementation.key_vault_key_uri)

  service.managed:
    kind: bool
    description: Managed backup service vs a self-operated backup store.

  cost.monthly:
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    description: Projected monthly cost (recovery-point storage).
    verification: static against a pricing catalog; billing after deploy

# Deliberately absent in v0.1 (implementation detail / opaque config — NOT vault
# capability semantics): the backup PLANS, schedules, and resource selections that
# populate the vault; the copy/replication rules to other vaults; the KMS key id
# itself (a customer key reference is impl); the vault-lock cooling-off window; and
# the individual recovery points (they are the data, not the capability).
