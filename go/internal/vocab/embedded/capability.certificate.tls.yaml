# Attribute vocabulary for capability.certificate.tls, spec v0.1 (D117).
#
# A managed TLS certificate for a domain — auto-provisioned, domain-validated and
# AUTO-RENEWED by the provider. The twin is AWS ACM (public certificate) and GCP
# Certificate Manager (managed certificate).
#
# This is an HONEST TWO-CLOUD domain: Azure has no MANAGEMENT-PLANE managed-TLS-cert
# twin. Key Vault certificates are DATA-PLANE (the vault.azure.net endpoint, a
# different auth surface than the ARM bearer token this runtime uses), and App
# Service managed certificates are coupled to an App Service Plan. So an azure
# candidate is REFUSED by fail-closed dispatch, never a faked third mapping (the
# search/streaming stance, applied again).
#
# The certificate's PRIVATE KEY is NEVER a groundhold concern — secrets are
# structurally excluded (D53). groundhold declares "a valid, auto-renewed cert for
# this domain exists"; the key material stays with the provider.

capability: capability.certificate.tls
version: 0.1
stateful: false   # a managed certificate is reprovisionable protective config, not
                  # stored data — retirement breaks TLS for the domain until reissue,
                  # but loses no records (no D47 data-loss friction).

attributes:

  location.region:
    kind: string
    description: >
      Region/location the certificate is issued in. For a CloudFront-fronted cert
      this is us-east-1 (ACM's global-edge region); GCP certs carry a location
      ("global" for global load balancers, or a region).
    mappings:
      aws.acm: the ACM endpoint region
      gcp.certmanager: the certificate's location

  domain:
    kind: string
    description: >
      The primary fully-qualified domain the certificate is valid for (e.g.
      app.example.com). Additional SANs are implementation detail carried under
      `implementation:`, not a capability path.
    mappings:
      aws.acm: RequestCertificate DomainName
      gcp.certmanager: managed.domains[0]
      k8s.certmanager: spec.dnsNames[0] — the PRIMARY domain. Further entries are
        SANs and are implementation detail, reported as a diagnostic rather than
        folded into this single-valued attribute

  validation.method:
    kind: string
    enum: [dns, email]
    description: >
      How the provider proves domain control before issuing. dns = a DNS record
      (the 2-cloud path, and the only method that supports auto-renewal). email is
      honored ONLY on AWS ACM; on GCP it is REFUSED (Certificate Manager validates
      via DNS authorization or the attached load balancer, never email).
    mappings:
      aws.acm: RequestCertificate ValidationMethod (DNS | EMAIL)
      gcp.certmanager: managed.dnsAuthorizations (DNS) — email refused

  auto.renew:
    kind: bool
    description: >
      The provider automatically renews the certificate before expiry. A managed
      certificate auto-renews by definition, so false (a manually-renewed / imported
      cert) is refused — that is a self-managed cert, out of this capability's scope.
      Auto-renewal REQUIRES dns validation (an email-validated ACM cert cannot
      auto-renew).
    mappings:
      aws.acm: RenewalEligibility = ELIGIBLE (DNS-validated public certs)
      gcp.certmanager: managed certificates auto-renew
      k8s.certmanager: const true — a cert-manager Certificate renews by design (the
        controller reconciles it), so this is config-intent, not a measured field

  service.managed:
    kind: bool
    description: Managed service vs self-operated

  cost.monthly:
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    description: Projected monthly cost of the capability
    verification: static against a pricing catalog; provider-api (billing) after deploy

# Deliberately absent in v0.1: subject alternative names (SANs), key algorithm /
# size, certificate transparency logging, the private key (structurally excluded —
# secrets never transit groundhold, D53). A candidate may carry SANs / key algorithm
# under `implementation:`; the verifier ignores them.
