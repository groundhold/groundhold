# Attribute vocabulary for capability.secret, spec v0.1 (D97).
# A managed, encrypted, versioned SECRET HANDLE — a governed envelope for a
# credential whose VALUE is supplied out of band (the value is DATA, like object
# contents or DB rows, never a declared attribute). Deliberately THIN: the two
# things everyone wants from "managed secrets" — rotation and per-principal access
# — are precisely the two the system must REFUSE, because rotation is a property of
# the credential's PRODUCER (a workload + the knowledge to mint a new value), not of
# the store, and access is IAM. A vocabulary whose main job is to state that loudly
# is more honest than a checkbox that lies.

capability: capability.secret
version: 0.1
stateful: true   # a secret holds credential data; retirement is data loss

attributes:

  location.region:
    kind: string
    description: >
      Primary region where the secret is stored. NOTE gcp Secret Manager defaults
      to AUTOMATIC (global) replication — this maps to a pinned userManaged replica,
      NOT the API region; a secret with automatic replication has no residency
      guarantee and observe refuses to report a region for it (a residency lie is
      forbidden).
    mappings:
      aws.secretsmanager: secret region
      gcp.secretmanager: replication.userManaged replica location (NOT automatic)
      azure.keyvault: the constitutive vault's location

  network.publicExposure:
    kind: bool
    description: Whether any public/anonymous read path to the secret exists.
    mappings:
      aws.secretsmanager: no Principal:"*" in the secret resource policy
      gcp.secretmanager: no allUsers/allAuthenticatedUsers IAM binding
      azure.keyvault: vault publicNetworkAccess=Disabled / default-deny networkAcls
    note: >
      static verification proves configuration intent; an anonymous-access probe
      proves the actual absence of a public path.

  encryption.atRest:
    kind: bool
    description: Provider-side encryption of the stored secret. Always true (const).
    mappings:
      aws.secretsmanager: always encrypted (KMS)
      gcp.secretmanager: always encrypted
      azure.keyvault: always encrypted

  encryption.customerManagedKeys:
    kind: bool
    description: >
      The secret is encrypted with a CUSTOMER-managed key. Honored on AWS/GCP;
      REFUSED on Azure — Key Vault IS the key service and exposes no customer
      wrapping key over the secret store itself (accepting it would lie on Azure).
    mappings:
      aws.secretsmanager: KmsKeyId (a customer key)
      gcp.secretmanager: replication.*.customerManagedEncryption.kmsKeyName
      azure.keyvault: REFUSED (Key Vault is the key service; no CMK-over-vault knob)

  service.managed:
    kind: bool
    description: Managed service vs self-operated

  cost.monthly:
    kind: money
    evidence: projection      # D311: a forecast, never resource state
    description: >
      Projected monthly cost. NOTE gcp prices per version-per-replica, so a static
      figure is coupled to data volume (version count), not just the handle.
    verification: static against a pricing catalog; billing after deploy

# Deliberately absent in v0.1 — REFUSED, and the refusal is the point:
#   - the secret VALUE / content: DATA, never a declaration attribute. On Azure a
#     Key Vault secret has no versionless form (setSecret IS value-write); the driver
#     must NEVER fabricate a placeholder value (that fabricates a credential) — the
#     durable Azure resource is the vault + a reserved name, "envelope ready, zero
#     versions".
#   - rotation.enabled: rotation is the credential PRODUCER's property (a workload),
#     not the store's — a second binding on every cloud (AWS Lambda; GCP only
#     publishes a Pub/Sub reminder — nothing rotates; Azure rotates keys not secrets).
#     The path-honesty boundary, like messaging exactly-once. Future: an outcome
#     probe rotation.maxAge (measure the newest version's age), never a declared flag.
#   - per-principal access: IAM/authorization, a different capability.
#   - expiry/TTL: no uniform semantic (AWS none, GCP ttl DESTROYS, Azure exp blocks
#     read). version retention: no knob anywhere. multi-region replication: topology.
#   - destruction friction (recovery window / purge protection): AWS's is a
#     delete-time parameter, not a stored property — deferred, never a ledger promise.
