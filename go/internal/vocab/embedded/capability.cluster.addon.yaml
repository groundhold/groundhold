# Attribute vocabulary for capability.cluster.addon, spec v0.1 (D149).
#
# A managed CLUSTER ADDON — a platform component the cloud installs and versions
# as a first-class cluster sub-resource (EKS managed addons: vpc-cni, coredns,
# kube-proxy, aws-ebs-csi-driver, eks-pod-identity-agent). These are INFRASTRUCTURE,
# not application workloads: without the EBS CSI driver there are no PersistentVolumes
# (Loki/Prometheus never start), without vpc-cni no pod networking, without the
# pod-identity-agent no workload identity — the cluster is dead before ArgoCD exists
# (Acme D2: the boundary is coupling with cloud identity at cluster birth). What an
# organization governs: which addon, at which VERSION (currency for CVE/EOL). The
# addon's configuration and the role it assumes are operator OPERANDS (impl block,
# D26): the cluster and an optional serviceRoleArn (for addons that assume a cloud
# role, e.g. the EBS CSI driver) are passed in, not addon attributes.
#
# One TYPE, many services (D76): aws.eks-addon today; gcp/azure managed addons
# fulfil the same contract. STATELESS: an addon is a replaceable component —
# retirement destroys no durable data.

capability: capability.cluster.addon
version: 0.1
stateful: false

attributes:

  addon.name:
    kind: string
    # D690: NO `enum:`, deliberately, and this comment is the reason. The three
    # drivers accept three DISJOINT closed sets — an EKS addon is a versioned
    # package, a GKE addon is a cluster flag, an AKS addon is an addonProfile key —
    # so their union is not a set any single candidate can draw from, and declaring
    # it would make the loader accept a name the chosen cloud refuses while
    # implying it is portable. The per-provider sets are published below instead,
    # where `explain` prints them, and each driver refuses a name outside its own.
    description: >
      The managed addon. The accepted names are PER PROVIDER and do not overlap —
      see the mappings below for each cloud's set.
    mappings:
      aws.eks-addon: >
        DescribeAddon addonName — free-form EKS addon names (vpc-cni, coredns,
        kube-proxy, aws-ebs-csi-driver, eks-pod-identity-agent, ...)
      # GKE addons are cluster addonsConfig FLAGS, not versioned packages: the
      # canonical name maps to an addonsConfig field (gce-pd-csi-driver ->
      # gcePersistentDiskCsiDriverConfig, http-load-balancing -> httpLoadBalancing,
      # network-policy -> networkPolicyConfig, ...).
      gcp.gke-addon: >
        cluster addonsConfig field (canonical name -> field + toggle); the driver
        accepts exactly: backup-agent, config-connector, dns-cache,
        filestore-csi-driver, gce-pd-csi-driver, horizontal-pod-autoscaling,
        http-load-balancing, network-policy
      # D545: read from the driver.
      azure.aks-addon: >
        the addon profile key on the managed cluster; the driver accepts exactly:
        azure-policy, http-application-routing, ingress-appgw,
        keyvault-secrets-provider, monitoring, open-service-mesh

  addon.version:
    kind: string
    description: The addon version — governed for CVE/EOL currency, upgraded in place
    mappings:
      aws.eks-addon: DescribeAddon addonVersion
      # HONEST REFUSAL: GKE does not version addons independently — they track the
      # cluster version. gke-addon refuses a pinned addon.version rather than
      # fabricate one; observe emits a managed-by-cluster diagnostic, never a value.
      gcp.gke-addon: unsupported (versions track the cluster version)

  service.managed:
    kind: bool
    description: Whether groundhold manages this addon
    mappings:
      aws.eks-addon: const true when observed through the driver
      gcp.gke-addon: const true when observed through the driver
      azure.aks-addon: const true
