# Schema-driven mapping: Flux Kustomization (kustomize.toolkit.fluxcd.io/v1) ->
# capability.gitops.application. The EQUAL twin of k8s.argocd-application: the same
# neutral capability, a different controller, its own normalising lens. This is the
# proof the GitOps witness is vendor-agnostic — Flux and ArgoCD are peers, neither
# privileged, and a third controller (Fleet, Jenkins X) is just another mapping.
# Flux is condition-based: the lens reads status.conditions (Ready/Reconciling) and
# projects them onto the neutral sync/health enums. source.repoURL RESOLVES the
# sourceRef to the GitRepository it names and reads that object's spec.url (D551) —
# the ArgoCD twin emits a URL, so this one must too or the neutral capability is not
# portable and the attribute stops being provenance.
# Observe-only: groundhold witnesses Flux, never authors the Kustomization.
mapping: v0.1
fieldpath: groundhold/fieldpath/v1
service: flux-kustomization
provider: k8s
capability: capability.gitops.application
vocab:
  capability.gitops.application: "0.1"

resource:
  group: kustomize.toolkit.fluxcd.io
  version: v1
  kind: Kustomization
  plural: kustomizations
  scope: Namespaced

schema:
  source: "kustomize.toolkit.fluxcd.io/v1 Kustomization CRD (spec.versions[].schema)"
  # Authored against testdata/flux-kustomization-openapi.json — a VERBATIM recording
  # from a live API server with `description` stripped (the fingerprint excludes it by
  # construction, and the live-cluster gate proves the hash is unchanged). D511.
  # Since D551 the surface spans TWO documents: this CRD and the GitRepository CRD
  # (testdata/flux-gitrepository-openapi.json), because source.repoURL reads a field
  # over there. A hop whose remote half is unfingerprinted would let that field drift
  # under a pin claiming to cover the attribute.
  mappedSurface: sha256:d28da26b8dd4d9d6ece8f0fe191321e2021684d95daf3ebab6e6624c93f7a910

lenses:
  - k8s.gitops.fluxStatus

attributes:
  source.repoURL:
    field: spec.sourceRef.name
    op: resolve-ref
    ref:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: GitRepository
      plural: gitrepositories
      scope: Namespaced
      namespace: spec.sourceRef.namespace
      field: spec.url
    type: string
    derivation: measured
  service.managed:
    op: const
    value: true
    derivation: measured
