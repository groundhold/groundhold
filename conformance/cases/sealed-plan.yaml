  - name: plan-with-invalid-risk-vector-is-load-error
    description: D33 - the risk vector is complete or the plan is refused.
    document:
      apiVersion: plan/v0
      kind: SealedPlan
      plan:
        contract: h1
        reads:
          contractHash: "sha256:c07bcf79091106cb2fc4b21306ae4a1f31fafe2134198a2e5c7bb6ac0c15a825"
          candidateHash: "sha256:eb5959117c0065812904b828078b0b1672bf6e99e7d2b724529b8ff61a1df2b8"
          heads: { db: genesis }
          toolchain: { compiler: groundhold-ref/0.1, spec: contract/v0.1 }
        writes: [db]
        actions:
          - id: a-create
            capability: db
            operation: create
            target: t1
            idempotencyKey: k1
            risk:
              reversibility: R9
              dataLoss: none
              downtime: none
              securityExposure: none
              costDelta: { amount: 0, currency: EUR }
              identityReplacement: false
        preconditions:
          - type: report-executable
