# Sealed Plan IR v0 (spec/sealed-plan.md, D36). The reads block of the
# pinned case reuses the literal contract/candidate hashes from
# cases/canonicalization.yaml — the artifacts chain together.

cases:
  - name: sealed-plan-hash-is-pinned
    document:
      apiVersion: plan/v0
      kind: SealedPlan
      plan:
        contract: h1
        environment: test
        reads:
          contractHash: "sha256:c07bcf79091106cb2fc4b21306ae4a1f31fafe2134198a2e5c7bb6ac0c15a825"
          candidateHash: "sha256:eb5959117c0065812904b828078b0b1672bf6e99e7d2b724529b8ff61a1df2b8"
          heads: { db: genesis }
          toolchain: { compiler: groundhold-ref/0.1, spec: contract/v0.1 }
        writes: [db]
        actions:
          - id: a-create
            capability: db
            operation: create
            target: cloudsql.instance/primary
            idempotencyKey: db-create-1
            risk:
              reversibility: R2
              dataLoss: none
              downtime: none
              securityExposure: none
              costDelta: { amount: 100, currency: EUR }
              identityReplacement: false
        preconditions:
          - type: report-executable
    expect:
      hash: sha256:09781f7e9db2fd7822745f6f548e43ba5bb56812f48fd8affafcd62586b352d2

