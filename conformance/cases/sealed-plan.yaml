          toolchain: { compiler: groundhold-ref/0.1, spec: contract/v0.1 }
        writes: [db]
        actions:
          - id: a-one
            capability: db
            operation: create
            target: t1
            idempotencyKey: k1
            dependsOn: [a-two]
            risk:
              reversibility: R1
              dataLoss: none
              downtime: none
              securityExposure: none
              costDelta: { amount: 0, currency: EUR }
              identityReplacement: false
          - id: a-two
            capability: db
            operation: update
            target: t2
            idempotencyKey: k2
            dependsOn: [a-one]
            risk:
              reversibility: R1
              dataLoss: none
              downtime: none
