# Registry image outputs (F-registry / D226 consumer proof): a container image
# registry (ECR / Artifact Registry / ACR) now declares a typed repositoryUri
# create output, so a workload.container candidate wires its image as a
# structured {$ref:{capability,output}} instead of a hand-pasted literal — the
# whole loop stays pure-groundhold. Compile behaviour is Go-runtime (D24), so
# every case carries impl: go. The verifier is untouched: the $ref lives in the
# implementation block (D26), which the verifier ignores. Symmetric across all
# three clouds — the same registry -> repositoryUri -> image wiring on each.
suite: registry-image-outputs
cases:
  - name: gcp-cloudrun-wires-image-from-artifactregistry-repositoryUri
    impl: go
    description: >
      GCP: a Cloud Run workload wires image = $ref
      artifactregistry.repositoryUri. Two creates; the consumer carries a
      symbolic reference (kind string) + a DependsOn on the registry's create.
      Only the symbolic structure is in the plan — restart-stable.
    plan:
      at: "2026-07-22T10:00:00Z"
      contract: &gcp-contract
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: reg-gcp, environment: test, version: 1 }
        capabilities:
          - id: registry
            type: capability.registry.image
          - id: app
            type: capability.workload.container
        constraints:
          hard:
            - id: c-registry-managed
              subject: registry
              path: service.managed
              op: equals
              value: true
              verify: { method: static }
            - id: c-app-managed
              subject: app
              path: service.managed
              op: equals
              value: true
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: reg-gcp
        capabilities:
          registry:
            provider: gcp
            service: artifactregistry
            attributes:
              service.managed: true
              location.region: europe-west1
          app:
            provider: gcp
            service: cloudrun
            attributes:
              service.managed: true
            implementation:
              image:
                $ref: { capability: registry, output: repositoryUri }
    expect:
      actions:
        a-create-registry:
          operation: create
        a-create-app:
          operation: create
          dependsOn: [a-create-registry]
          references:
            - slot: image
              producerAction: a-create-registry
              capability: registry
              output: repositoryUri
              kind: string

  - name: aws-ecs-wires-image-from-ecr-repositoryUri
    impl: go
    description: >
      AWS: an ECS workload wires image = $ref ecr.repositoryUri — the ECR
      repositoryUri (accountId.dkr.ecr.region.amazonaws.com/repo) is derived
      from the create's pid, so a same-plan consumer resolves it at apply.
    plan:
      at: "2026-07-22T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: reg-aws, environment: test, version: 1 }
        capabilities:
          - id: registry
            type: capability.registry.image
          - id: app
            type: capability.workload.container
        constraints:
          hard:
            - id: c-registry-managed
              subject: registry
              path: service.managed
              op: equals
              value: true
              verify: { method: static }
            - id: c-app-managed
              subject: app
              path: service.managed
              op: equals
              value: true
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: reg-aws
        capabilities:
          registry:
            provider: aws
            service: ecr
            attributes:
              service.managed: true
          app:
            provider: aws
            service: ecs
            attributes:
              service.managed: true
            implementation:
              image:
                $ref: { capability: registry, output: repositoryUri }
    expect:
      actions:
        a-create-registry:
          operation: create
        a-create-app:
          operation: create
          dependsOn: [a-create-registry]
          references:
            - slot: image
              producerAction: a-create-registry
              capability: registry
              output: repositoryUri
              kind: string

  - name: azure-containerapps-wires-image-from-acr-repositoryUri
    impl: go
    description: >
      Azure: a Container App wires image = $ref acr.repositoryUri — the ACR
      login server (registry.azurecr.io) is derived from the create's pid.
    plan:
      at: "2026-07-22T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: reg-az, environment: test, version: 1 }
        capabilities:
          - id: registry
            type: capability.registry.image
          - id: app
            type: capability.workload.container
        constraints:
          hard:
            - id: c-registry-managed
              subject: registry
              path: service.managed
              op: equals
              value: true
              verify: { method: static }
            - id: c-app-managed
              subject: app
              path: service.managed
              op: equals
              value: true
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: reg-az
        capabilities:
          registry:
            provider: azure
            service: acr
            attributes:
              service.managed: true
              location.region: westeurope
          app:
            provider: azure
            service: containerapps
            attributes:
              service.managed: true
            implementation:
              image:
                $ref: { capability: registry, output: repositoryUri }
    expect:
      actions:
        a-create-registry:
          operation: create
        a-create-app:
          operation: create
          dependsOn: [a-create-registry]
          references:
            - slot: image
              producerAction: a-create-registry
              capability: registry
              output: repositoryUri
              kind: string

  - name: log-retention-binds-to-the-group-the-function-actually-writes-to
    impl: go
    description: >
      D381. AWS creates /aws/lambda/<fn> itself, on first invocation, with NO
      retention — it keeps every line forever. groundhold never made that group,
      so nothing in a contract could reach it: capability.monitoring.logs could
      only ever create a SEPARATE group, which a Lambda does not write to. A
      field partner shipped a contract declaring 365-day retention while their
      real logs never expired, and the declaration read as satisfied — the
      "declared but not proven" gap this project exists to close, on the wrong
      side of it.
      The Lambda now publishes `logGroupName` as a typed create output, derived
      from the function name with no read, so the log capability points at the
      group that actually holds the logs via $ref (D226) — no interpolation and
      no join, because the whole value comes from the producer, which is what
      invariant #4 requires. The retention guarantee lands where the lines are.
    plan:
      at: "2026-07-27T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: logbind, environment: test, version: 1 }
        capabilities:
          - id: api
            type: capability.function.serverless
          - id: logs
            type: capability.monitoring.logs
        constraints:
          hard:
            - id: c-retention
              subject: logs
              path: retention.days
              op: gte
              value: 365d
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: logbind
        capabilities:
          api:
            provider: aws
            service: lambda
            attributes:
              location.region: eu-central-1
              service.managed: true
            implementation:
              image_uri: 000000000000.dkr.ecr.eu-central-1.amazonaws.com/api:v1
              role_arn: arn:aws:iam::000000000000:role/api-exec
          logs:
            provider: aws
            service: cwlogs
            attributes:
              location.region: eu-central-1
              retention.days: 365d
              service.managed: true
            implementation:
              log_group:
                $ref: { capability: api, output: logGroupName }
    expect:
      actions:
        a-create-api:
          operation: create
        a-create-logs:
          operation: create
          dependsOn: [a-create-api]
          references:
            - slot: log_group
              producerAction: a-create-api
              capability: api
              output: logGroupName
              kind: string
