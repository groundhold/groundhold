# D23: the vocabulary is an optional, strengthening input. Without one,
# behavior is exactly that of the earlier cases (unit-mismatch stays a
# verify-time unverifiable). With one, candidate values on vocabulary paths
# are kind/enum-checked at load, and every verdict carries pathInVocabulary.
# A case opts in by carrying `vocab:` — a list of vocabulary documents.

cases:
  - name: vocab-kind-mismatch-in-candidate-is-load-error
    description: >
      The vocabulary says recovery.rpo is a duration. A candidate declaring
      money there is ill-typed authorship — refused at load (D19), before
      any constraint is ever evaluated.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          recovery.rpo: { kind: duration }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v1, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v1
      capabilities:
        db:
          attributes:
            recovery.rpo: 5 EUR
    expect:
      error: candidate

  - name: vocab-enum-violation-is-load-error
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          availability.class:
            kind: string
            enum: [zonal, regional, multi-regional]
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v2, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v2
      capabilities:
        db:
          attributes:
            availability.class: galactic
    expect:
      error: candidate

  - name: unknown-path-is-flagged-not-rejected
    description: >
      Paths outside the vocabulary stay legal — rejecting them would close
      the door on extension vocabularies before the governance model exists.
      The verdict carries pathInVocabulary so policy can gate on it.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          encryption.atRest: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v3, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
      constraints:
        hard:
          - id: c-encrypted
            subject: db
            path: encryption.atRest
            op: equals
            value: true
            verify: { method: static }
          - id: c-custom
            subject: db
            path: custom.replicaWarmup
            op: exists
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v3
      capabilities:
        db:
          attributes:
            encryption.atRest: true
            custom.replicaWarmup: 5m
    expect:
      executable: true
      verdicts:
        c-encrypted: satisfied
        c-custom: satisfied
      pathInVocabulary:
        c-encrypted: true
        c-custom: false

  - name: without-vocab-verdicts-carry-no-flag
    description: >
      No vocabulary provided -> no claim about the path either way.
      The flag is null, never a guessed true/false.
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v4, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
      constraints:
        hard:
          - id: c-encrypted
            subject: db
            path: encryption.atRest
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v4
      capabilities:
        db:
          attributes:
            encryption.atRest: true
    expect:
      executable: true
      verdicts:
        c-encrypted: satisfied
      pathInVocabulary:
        c-encrypted: null

  - name: numeric-vocab-enum-accepts-a-matching-number
    description: >
      Cross-impl parity (review fix): a vocabulary enum of NUMBERS must
      accept a candidate whose value equals an element. A numeric enum
      decodes as int while the parsed scalar value is a float, so raw
      interface equality (float64 vs int) rejected every numeric enum —
      the reference accepted it (3.0 == 3). Both must ACCEPT now.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          cache.replicas:
            kind: number
            enum: [1, 3, 5]
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: venum, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: venum
      capabilities:
        db:
          attributes:
            cache.replicas: 3
    expect:
      executable: true
      verdicts: {}

  - name: numeric-vocab-enum-refuses-a-nonmember-number
    description: >
      The other side of the fix: a number OUTSIDE the enum is still a
      load error in both implementations — the canonical comparison
      must not accept everything, only exact members.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          cache.replicas:
            kind: number
            enum: [1, 3, 5]
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: venum2, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: venum2
      capabilities:
        db:
          attributes:
            cache.replicas: 4
    expect:
      error: candidate

  - name: money-amount-must-be-a-number-not-a-string
    description: >
      Cross-impl parity (review fix): a money object with a STRING
      amount ({amount:"100"}) is refused by BOTH implementations and by
      candidate.schema.json (amount:{type:number}). The reference used
      float() coercion and silently accepted it; now both refuse.
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: money, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
      constraints:
        hard:
          - id: c-cost
            subject: db
            path: cost.monthly
            op: lte
            value: { amount: 1500, currency: EUR }
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: money
      capabilities:
        db:
          attributes:
            cost.monthly: { amount: "100", currency: USD }
    expect:
      error: candidate
  - name: vocab-unordered-list-canonicalizes-to-a-set
    description: |
      D532, from the field: an attribute the vocabulary describes as "the full set of
      regions" was compared POSITIONALLY, so a candidate declaring the identical set in
      a different order than the cloud returns it was refused with "adoption must not
      lie". The sets were equal; only the order differed, and a set has no order.

      `unordered: true` marks a list whose order carries no meaning. Such a list is
      CANONICALIZED (sorted) at load, so declared and observed compare equal everywhere
      — verifier, adopt, reconcile — with no second meaning of equality and no new
      operator (invariant #4 untouched). D34's answer to "two forms, one meaning",
      applied to a type rather than to a document.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          network.zones:
            kind: list
            unordered: true
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v-unord, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
      constraints:
        hard:
          - id: c-zones
            subject: db
            path: network.zones
            op: equals
            value: [eu-central-1a, eu-central-1b, eu-central-1c]
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v-unord
      capabilities:
        db:
          attributes:
            network.zones: [eu-central-1c, eu-central-1a, eu-central-1b]
    expect:
      executable: true
      verdicts:
        c-zones: satisfied

  - name: vocab-unordered-set-ignores-the-contracts-own-order
    description: |
      D660. D532 canonicalized the CANDIDATE's list at load and left the constraint's
      own operand exactly as the contract author typed it — and list equality is
      positional. The case above happens to write the operand already sorted, so it
      passed either way; this one writes it in a different order, which is the half
      that was broken.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          network.zones:
            kind: list
            unordered: true
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v-unord2, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
      constraints:
        hard:
          - id: c-zones
            subject: db
            path: network.zones
            op: equals
            value: [eu-central-1c, eu-central-1a, eu-central-1b]
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v-unord2
      capabilities:
        db:
          attributes:
            network.zones: [eu-central-1a, eu-central-1b, eu-central-1c]
    expect:
      executable: true
      verdicts:
        c-zones: satisfied

  - name: vocab-unordered-set-is-forbidden-in-every-order
    description: |
      D660, the dangerous direction. `not-equals` over a set must refuse that set
      however either side spells it. With only the candidate canonicalized, this
      contract PROVED the very set it forbids — and the one shipped `unordered`
      attribute is inference.destinationRegions, the data-residency surface.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          network.zones:
            kind: list
            unordered: true
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v-unord3, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
      constraints:
        hard:
          - id: c-not-zones
            subject: db
            path: network.zones
            op: not-equals
            value: [eu-central-1c, eu-central-1a, eu-central-1b]
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v-unord3
      capabilities:
        db:
          attributes:
            network.zones: [eu-central-1a, eu-central-1b, eu-central-1c]
    expect:
      executable: false
      verdicts:
        c-not-zones: violated

  - name: vocab-ordered-list-still-compares-positionally
    description: |
      The default is unchanged and must stay so: a plain `kind: list` is an ORDERED
      sequence and order is part of its identity (D21). Only an attribute declaring
      `unordered: true` is a set, so sensitivity to order survives exactly where order
      means something.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        attributes:
          network.zones:
            kind: list
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: v-ord, environment: test, version: 1 }
      capabilities:
        - id: db
          type: capability.database.relational
      constraints:
        hard:
          - id: c-zones
            subject: db
            path: network.zones
            op: equals
            value: [eu-central-1a, eu-central-1b, eu-central-1c]
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: v-ord
      capabilities:
        db:
          attributes:
            network.zones: [eu-central-1c, eu-central-1a, eu-central-1b]
    expect:
      executable: false
      verdicts:
        c-zones: violated
