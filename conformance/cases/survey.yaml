# Code-survey coverage (D93). impl: go — single-implementation per D24.
# The survey is a commit-pinned witness of what the code needs;
# `groundhold survey` compares it to the contract. Absence of evidence is
# never drift unless the survey set is declared --complete.

contract: &sys1
  apiVersion: contract/v0.1
  kind: InfrastructureContract
  meta: { id: sys1, environment: test, version: 1 }
  capabilities:
    - id: db
      type: capability.database.relational
  constraints:
    hard:
      - id: c-enc
        subject: db
        path: encryption.atRest
        op: equals
        value: true
        verify: { method: static }

cases:
  - name: covered-required-dependency-passes
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          service: orders-api
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: psycopg
              class: required
              capabilityHint: capability.database.relational
              evidence: ["app/db.py:12"]
    expect:
      exit: 0
      coverage: { psycopg: covered }
      orphans: {}

  - name: uncovered-required-dependency-is-drift
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: kafka-client
              class: required
              capabilityHint: capability.messaging.queue
              evidence: ["app/events.py:3"]
    expect:
      exit: 2
      code: survey-drift
      coverage: { kafka-client: uncovered }

  - name: unwitnessed-capability-is-not-drift-by-default
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: billing-api, commit: def456 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings: []
    expect:
      exit: 0
      orphans: { db: unwitnessed }

  - name: orphaned-capability-is-drift-when-complete
    impl: go
    survey:
      contract: *sys1
      complete: true
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: billing-api, commit: def456 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings: []
    expect:
      exit: 2
      code: survey-drift
      orphans: { db: orphaned }

  - name: dev-test-dependency-never-drifts
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: psycopg
              class: required
              capabilityHint: capability.database.relational
              evidence: ["app/db.py:12"]
            - dependency: redis
              class: dev-test
              capabilityHint: capability.cache.memory
              evidence: ["docker-compose.dev.yml:9"]
    expect:
      exit: 0
      coverage: { psycopg: covered, redis: ignored }

  - name: required-without-hint-is-a-gap-not-drift
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: psycopg
              class: required
              capabilityHint: capability.database.relational
              evidence: ["app/db.py:12"]
            - dependency: mystery-sdk
              class: required
              evidence: ["app/vendor.py:1"]
    expect:
      exit: 0
      coverage: { psycopg: covered, mystery-sdk: gap }

  - name: two-repos-witness-one-contract
    impl: go
    survey:
      contract: *sys1
      complete: true
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings: []
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: billing-api, commit: def456 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: pgx
              class: required
              capabilityHint: capability.database.relational
              evidence: ["internal/db/db.go:20"]
    expect:
      exit: 0
      coverage: { pgx: covered }
      orphans: {}

  - name: unpinned-survey-is-a-load-error
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api }
          generatedAt: "2026-07-14T00:00:00Z"
          findings: []
    expect:
      error: true

  - name: unknown-finding-class-is-a-load-error
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: psycopg
              class: probably-required
              evidence: ["app/db.py:12"]
    expect:
      error: true

  # D1253. A capabilityHint naming a type the VOCABULARY does not have is not the
  # same finding as one naming a real type the contract happens not to declare, and
  # the two used to be indistinguishable: both reported `uncovered`, both set drift,
  # both exited 2. An operator told "the code and the contract disagree about
  # reality" went to reconcile the contract, when the survey had a typo.
  #
  # Whether the contract covers a type nobody can resolve is UNKNOWN, and this
  # project does not collapse unknown into an answer. It still blocks — an
  # unresolvable witness is not a pass — but it says which question it could not
  # answer.
  - name: unresolvable-capability-hint-is-unknown-not-uncovered
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          service: orders-api
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: psycopg
              class: required
              capabilityHint: capability.database.relatoinal
              evidence: ["app/db.py:12"]
    expect:
      exit: 2
      coverage: { psycopg: unknown-type }
      orphans: { db: unwitnessed }

  # The control that gives the case above its meaning: a REAL type the contract does
  # not declare must keep reporting `uncovered`, or the new status has simply
  # renamed the old one and nothing is distinguished.
  - name: real-type-the-contract-lacks-is-still-uncovered
    impl: go
    survey:
      contract: *sys1
      surveys:
        - apiVersion: survey/v0.1
          kind: CodeSurvey
          repo: { name: orders-api, commit: abc123 }
          service: orders-api
          generatedAt: "2026-07-14T00:00:00Z"
          findings:
            - dependency: boto3
              class: required
              capabilityHint: capability.storage.object
              evidence: ["app/files.py:3"]
    expect:
      exit: 2
      coverage: { boto3: uncovered }
      orphans: { db: unwitnessed }
