  - name: block-storage-zone-survival-and-cmk-verify
    description: >
      capability.storage.block (D361). availability.class on a volume is a
      DURABILITY guarantee, not a performance tier: a regional disk survives losing
      a zone, a zonal one does not. A contract that needs the data to outlive a
      zone failure says so and has it verified, instead of trusting that somebody
      picked the right disk type.
    vocab:
      - capability: capability.storage.block
        version: 0.1
        stateful: true
        attributes:
          location.region: { kind: string }
          availability.class: { kind: string, enum: [zonal, regional] }
          encryption.customerManagedKeys: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: vol-1, environment: production, version: 1 }
      capabilities:
        - id: data
          type: capability.storage.block
      constraints:
        hard:
          - id: c-eu
            subject: data
            path: location.region
            op: in
            value: [europe-west1, eu-central-1]
            verify: { method: static }
          - id: c-survives-zone-loss
            subject: data
            path: availability.class
            op: equals
            value: regional
            verify: { method: static }
          - id: c-cmk
            subject: data
            path: encryption.customerManagedKeys
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: vol-1
      capabilities:
        data:
          attributes:
            location.region: europe-west1
            availability.class: regional
            encryption.customerManagedKeys: true
    expect:
      executable: true
      verdicts:
        c-eu: satisfied
        c-survives-zone-loss: satisfied
        c-cmk: satisfied

  - name: block-storage-zonal-volume-violates-zone-survival
    description: >
      A zonal volume under a contract that requires surviving a zone loss is
      `violated` at verify — before the outage, not during it. This is the check
      that makes the attribute worth having: "which disk type did we pick" is
      invisible in a review, "does this survive losing a zone" is a verdict.
    vocab:
      - capability: capability.storage.block
        version: 0.1
        stateful: true
        attributes:
          availability.class: { kind: string, enum: [zonal, regional] }
    contract:
      apiVersion: contract/v0.1
