# Breadth vocabularies (D60): object-storage, private-network,
# container-workload. Same engine, three more type systems — and the
# first STATELESS vocabulary, exercising the delete-policy branch that
# fail-closed defaults have hidden until now.

cases:
  - name: object-storage-contract-verifies
    description: >
      D60: retention as duration (lte/gte with no coercion), durability
      as enum, exposure as bool — an object-store compliance contract
      rides the standard verifier.
    vocab:
      - capability: capability.storage.object
        version: 0.1
        stateful: true
        attributes:
          durability.class:
            kind: string
            enum: [single-zone, regional, multi-regional]
          retention.minimum: { kind: duration }
          versioning.enabled: { kind: bool }
          network.publicExposure: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: st-1, environment: production, version: 1 }
      capabilities:
        - id: archive
          type: capability.storage.object
      constraints:
        hard:
          - id: c-durability
            subject: archive
            path: durability.class
            op: in
            value: [regional, multi-regional]
            verify: { method: static }
          - id: c-retention
            subject: archive
            path: retention.minimum
            op: gte
            value: 90d
            verify: { method: static }
          - id: c-versioning
            subject: archive
            path: versioning.enabled
            op: equals
            value: true
            verify: { method: static }
          - id: c-private
            subject: archive
            path: network.publicExposure
            op: equals
            value: false
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: st-1
      capabilities:
        archive:
          attributes:
            durability.class: multi-regional
            retention.minimum: 180d
            versioning.enabled: true
            network.publicExposure: false
    expect:
      executable: true
      verdicts:
        c-durability: satisfied
        c-retention: satisfied
        c-versioning: satisfied
        c-private: satisfied

  - name: object-storage-retention-maximum-is-a-duration-ceiling
    description: >
      retention.maximum (data minimization) is the dual of retention.minimum:
      a duration CEILING. lte satisfies when the candidate expires at or under
      the limit; a longer-lived candidate violates. No coercion, same engine.
    vocab:
      - capability: capability.storage.object
        version: 0.1
        stateful: true
        attributes:
          retention.minimum: { kind: duration }
          retention.maximum: { kind: duration }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: st-max, environment: production, version: 1 }
      capabilities:
        - id: pii
          type: capability.storage.object
      constraints:
        hard:
          - id: c-max
            subject: pii
            path: retention.maximum
            op: lte
            value: 365d
            verify: { method: static }
          - id: c-min
            subject: pii
            path: retention.minimum
            op: gte
            value: 30d
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: st-max
      capabilities:
        pii:
          attributes:
            retention.maximum: 90d
            retention.minimum: 30d
    expect:
      executable: true
      verdicts:
        c-max: satisfied
        c-min: satisfied

  - name: customer-managed-keys-across-db-and-storage
    description: >
      encryption.customerManagedKeys (CMEK) is a bool that spans two
      vocabularies — the SAME attribute in capability.database.relational and
      capability.storage.object. equals-true satisfies when a candidate
      declares a customer key; the provider default (false) violates. One
      engine, no coercion, two type systems.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        stateful: true
        attributes:
          encryption.customerManagedKeys: { kind: bool }
      - capability: capability.storage.object
        version: 0.1
        stateful: true
        attributes:
          encryption.customerManagedKeys: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: cmek-1, environment: production, version: 1 }
      capabilities:
        - id: ledger-db
          type: capability.database.relational
        - id: pii-store
          type: capability.storage.object
      constraints:
        hard:
          - id: c-db-cmek
            subject: ledger-db
            path: encryption.customerManagedKeys
            op: equals
            value: true
            verify: { method: static }
          - id: c-store-cmek
            subject: pii-store
            path: encryption.customerManagedKeys
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: cmek-1
      capabilities:
        ledger-db:
          attributes:
            encryption.customerManagedKeys: true
        pii-store:
          attributes:
            encryption.customerManagedKeys: true
    expect:
      executable: true
      verdicts:
        c-db-cmek: satisfied
        c-store-cmek: satisfied

  - name: database-encryption-in-transit-is-a-bool
    description: >
      encryption.inTransit (TLS enforced) is a bool in
      capability.database.relational: equals-true satisfies when a candidate
      enforces TLS. Provider-default "allow both" (false) violates. The verifier
      is provider-agnostic — one cloud honors it, another refuses at compile.
    vocab:
      - capability: capability.database.relational
        version: 0.1
        stateful: true
        attributes:
          encryption.inTransit: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: tls-1, environment: production, version: 1 }
      capabilities:
        - id: orders
          type: capability.database.relational
      constraints:
        hard:
          - id: c-tls
            subject: orders
            path: encryption.inTransit
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: tls-1
      capabilities:
        orders:
          attributes:
            encryption.inTransit: true
    expect:
      executable: true
      verdicts:
        c-tls: satisfied

  - name: object-storage-retention-locked-is-worm
    description: >
      retention.locked (WORM) is a bool: equals-true satisfies when the
      candidate declares an immutable retention lock. It presupposes
      retention.minimum (the floor being locked), so both ride together — the
      lock without a floor is meaningless. Same engine, no coercion.
    vocab:
      - capability: capability.storage.object
        version: 0.1
        stateful: true
        attributes:
          retention.minimum: { kind: duration }
          retention.locked: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: worm-1, environment: production, version: 1 }
      capabilities:
        - id: vault
          type: capability.storage.object
      constraints:
        hard:
          - id: c-locked
            subject: vault
            path: retention.locked
            op: equals
            value: true
            verify: { method: static }
          - id: c-min
            subject: vault
            path: retention.minimum
            op: gte
            value: 3650d
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: worm-1
      capabilities:
        vault:
          attributes:
            retention.locked: true
            retention.minimum: 3650d
    expect:
      executable: true
      verdicts:
        c-locked: satisfied
        c-min: satisfied

  - name: private-network-short-retention-violates
    description: >
      D60: a network that admits public ingress violates; egress left
      undeclared is unknown and BLOCKS — network contracts fail closed
      like everything else.
    vocab:
      - capability: capability.network.private
        version: 0.1
        stateful: true
        attributes:
          ingress.public: { kind: bool }
          egress.restricted: { kind: bool }
          flowLogs.enabled: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: net-1, environment: production, version: 1 }
      capabilities:
        - id: backbone
          type: capability.network.private
      constraints:
        hard:
          - id: c-no-ingress
            subject: backbone
            path: ingress.public
            op: equals
            value: false
            verify: { method: static }
          - id: c-egress
            subject: backbone
            path: egress.restricted
            op: equals
            value: true
            verify: { method: static }
          - id: c-flowlogs
            subject: backbone
            path: flowLogs.enabled
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: net-1
      capabilities:
        backbone:
          attributes:
            ingress.public: true
            flowLogs.enabled: true
    expect:
      executable: false
      verdicts:
        c-no-ingress: violated
        c-egress: unknown
        c-flowlogs: satisfied

  - name: container-workload-capacity-floor
    description: >
      D60: replicas.minimum as a number under gte — a capacity floor is
      capability semantics (availability), while cpu/memory tuning is
      implementation noise and stays out of the vocabulary.
    vocab: &workload-vocab
      - capability: capability.workload.container
        version: 0.1
        stateful: false
        attributes:
          replicas.minimum: { kind: number }
          network.publicExposure: { kind: bool }
          tls.enforced: { kind: bool }
          image.signedProvenance: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: wl-1, environment: production, version: 1 }
      capabilities:
        - id: api
          type: capability.workload.container
      constraints:
        hard:
          - id: c-floor
            subject: api
            path: replicas.minimum
            op: gte
            value: 2
            verify: { method: static }
          - id: c-signed
            subject: api
            path: image.signedProvenance
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: wl-1
      capabilities:
        api:
          attributes:
            replicas.minimum: 1
            image.signedProvenance: true
    expect:
      executable: false
      verdicts:
        c-floor: violated
        c-signed: satisfied

  - name: stateless-workload-retires-despite-delete-stateful-ban
    impl: go
    description: >
      D60: the first stateless vocabulary bites — autonomy.forbidden
      delete_stateful gates STATEFUL capabilities only. A container
      workload proves statelessness through its vocabulary, so its
      retirement compiles a delete with no consent needed (contrast
      D47: without a vocabulary the same plan refuses fail-closed).
    plan:
      at: "2026-07-12T17:00:00Z"
      bindings: { api: "fake:api-1" }
      vocab: *workload-vocab
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: wl-2, environment: test, version: 2 }
        capabilities:
          - id: api
            type: capability.workload.container
            state: retired
        autonomy:
          forbidden:
            - delete_stateful: true
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: wl-2
        capabilities: {}
    expect:
      actions:
        a-delete-api: delete

  - name: messaging-queue-broker-guarantees-verify
    description: >
      D94: a queue contract constrains the BROKER guarantees — exactly-once
      (string enum, no coercion), ordering (bool), retention floor (duration).
      Same engine; the exactly-once honesty caveat lives in the vocab description,
      not the verifier.
    vocab:
      - capability: capability.messaging.queue
        version: 0.1
        stateful: true
        attributes:
          delivery.guarantee: { kind: string, enum: [at-least-once, exactly-once] }
          ordering.enabled: { kind: bool }
          retention.minimum: { kind: duration }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: mq-1, environment: production, version: 1 }
      capabilities:
        - id: orders
          type: capability.messaging.queue
      constraints:
        hard:
          - id: c-exactly-once
            subject: orders
            path: delivery.guarantee
            op: in
            value: [exactly-once]
            verify: { method: static }
          - id: c-ordered
            subject: orders
            path: ordering.enabled
            op: equals
            value: true
            verify: { method: static }
          - id: c-retain
            subject: orders
            path: retention.minimum
            op: gte
            value: 7d
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: mq-1
      capabilities:
        orders:
          attributes:
            delivery.guarantee: exactly-once
            ordering.enabled: true
            retention.minimum: 14d
    expect:
      executable: true
      verdicts:
        c-exactly-once: satisfied
        c-ordered: satisfied
        c-retain: satisfied

  - name: queue-deadletter-reliability-verify
    description: >
      reliability.deadLetter is a posture bool: unprocessed messages are captured
      to a DLQ rather than lost. A "deadLetter equals true" hard constraint is
      satisfied by a candidate that asserts it (the DLQ target + retry threshold
      are implementation operands, never capability paths).
    vocab:
      - capability: capability.messaging.queue
        version: 0.1
        stateful: true
        attributes:
          reliability.deadLetter: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: mq-dlq, environment: production, version: 1 }
      capabilities:
        - id: tasks
          type: capability.messaging.queue
      constraints:
        hard:
          - id: c-deadletter
            subject: tasks
            path: reliability.deadLetter
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: mq-dlq
      capabilities:
        tasks:
          attributes:
            reliability.deadLetter: true
    expect:
      executable: true
      verdicts:
        c-deadletter: satisfied

  - name: messaging-topic-residency-and-cmek-verify
    description: >
      D94: a topic contract constrains residency + CMEK + exposure. A topic's
      vocabulary is thin (fan-out address holds nothing the author owns) — but
      residency (Pub/Sub is global by default) and customer-managed keys are real
      compliance truths.
    vocab:
      - capability: capability.messaging.topic
        version: 0.1
        stateful: true
        attributes:
          encryption.customerManagedKeys: { kind: bool }
          network.publicExposure: { kind: bool }
          location.region: { kind: string }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: mt-1, environment: production, version: 1 }
      capabilities:
        - id: events
          type: capability.messaging.topic
      constraints:
        hard:
          - id: c-cmek
            subject: events
            path: encryption.customerManagedKeys
            op: equals
            value: true
            verify: { method: static }
          - id: c-private
            subject: events
            path: network.publicExposure
            op: equals
            value: false
            verify: { method: static }
          - id: c-residency
            subject: events
            path: location.region
            op: equals
            value: europe-west1
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: mt-1
      capabilities:
        events:
          attributes:
            encryption.customerManagedKeys: true
            network.publicExposure: false
            location.region: europe-west1
    expect:
      executable: true
      verdicts:
        c-cmek: satisfied
        c-private: satisfied
        c-residency: satisfied

  - name: secret-handle-residency-and-cmek-verify
    description: >
      D97: capability.secret is a thin managed-secret handle — residency (region),
      exposure (bool), CMK (bool). The value is DATA, never declared. Same engine.
    vocab:
      - capability: capability.secret
        version: 0.1
        stateful: true
        attributes:
          location.region: { kind: string }
          network.publicExposure: { kind: bool }
          encryption.customerManagedKeys: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: sec-1, environment: production, version: 1 }
      capabilities:
        - id: dbcreds
          type: capability.secret
      constraints:
        hard:
          - id: c-region
            subject: dbcreds
            path: location.region
            op: equals
            value: europe-west1
            verify: { method: static }
          - id: c-private
            subject: dbcreds
            path: network.publicExposure
            op: equals
            value: false
            verify: { method: static }
          - id: c-cmek
            subject: dbcreds
            path: encryption.customerManagedKeys
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: sec-1
      capabilities:
        dbcreds:
          attributes:
            location.region: europe-west1
            network.publicExposure: false
            encryption.customerManagedKeys: true
    expect:
      executable: true
      verdicts:
        c-region: satisfied
        c-private: satisfied
        c-cmek: satisfied

  - name: cache-keyvalue-residency-encryption-availability-verify
    description: >
      capability.cache.keyvalue is a managed in-memory cache (Redis, 3-cloud) —
      the sibling of database.relational. Residency (region), protocol, exposure
      (bool), encryption at-rest/in-transit/CMK, and availability.class are all
      capability semantics; node/memory/eviction sizing is implementation noise.
    vocab:
      - capability: capability.cache.keyvalue
        version: 0.1
        stateful: true
        attributes:
          engine.protocol: { kind: protocol }
          location.region: { kind: string }
          network.publicExposure: { kind: bool }
          encryption.atRest: { kind: bool }
          encryption.inTransit: { kind: bool }
          encryption.customerManagedKeys: { kind: bool }
          availability.class: { kind: string, enum: [zonal, regional, multi-regional] }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: cache-1, environment: production, version: 1 }
      capabilities:
        - id: sessions
          type: capability.cache.keyvalue
      constraints:
        hard:
          - id: c-engine
            subject: sessions
            path: engine.protocol
            op: equals
            value: redis/7
            verify: { method: static }
          - id: c-region
            subject: sessions
            path: location.region
            op: equals
            value: europe-west1
            verify: { method: static }
          - id: c-tls
            subject: sessions
            path: encryption.inTransit
            op: equals
            value: true
            verify: { method: static }
          - id: c-ha
            subject: sessions
            path: availability.class
            op: equals
            value: regional
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: cache-1
      capabilities:
        sessions:
          attributes:
            engine.protocol: redis/7
            location.region: europe-west1
            network.publicExposure: false
            encryption.atRest: true
            encryption.inTransit: true
            encryption.customerManagedKeys: true
            availability.class: regional
    expect:
      executable: true
      verdicts:
        c-engine: satisfied
        c-region: satisfied
        c-tls: satisfied
        c-ha: satisfied

  - name: cache-availability-class-enum-is-enforced
    description: >
      availability.class is a closed enum; multi-regional has no single managed
      Redis primitive and a bogus value must be a load error, not a silent pass.
    vocab:
      - capability: capability.cache.keyvalue
        version: 0.1
        stateful: true
        attributes:
          availability.class: { kind: string, enum: [zonal, regional, multi-regional] }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: cache-enum, environment: test, version: 1 }
      capabilities:
        - id: c
          type: capability.cache.keyvalue
      constraints:
        hard:
          - id: c-ha
            subject: c
            path: availability.class
            op: equals
            value: regional
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: cache-enum
      capabilities:
        c:
          attributes:
            availability.class: galactic
    expect:
      error: candidate

  - name: dns-zone-domain-exposure-dnssec-verify
    description: >
      capability.dns.zone is a managed authoritative DNS zone (3-cloud: Cloud DNS,
      Route 53, Azure DNS). The zone's domain, public/private reach, and DNSSEC
      state are capability semantics; the RECORDS are data, out of band. Same
      thin-envelope stance as capability.secret.
    vocab:
      - capability: capability.dns.zone
        version: 0.1
        stateful: true
        attributes:
          zone.domain: { kind: string }
          network.publicExposure: { kind: bool }
          dnssec.enabled: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: dns-1, environment: production, version: 1 }
      capabilities:
        - id: apex
          type: capability.dns.zone
      constraints:
        hard:
          - id: c-domain
            subject: apex
            path: zone.domain
            op: equals
            value: example.com
            verify: { method: static }
          - id: c-public
            subject: apex
            path: network.publicExposure
            op: equals
            value: true
            verify: { method: static }
          - id: c-dnssec
            subject: apex
            path: dnssec.enabled
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: dns-1
      capabilities:
        apex:
          attributes:
            zone.domain: example.com
            network.publicExposure: true
            dnssec.enabled: true
    expect:
      executable: true
      verdicts:
        c-domain: satisfied
        c-public: satisfied
        c-dnssec: satisfied

  - name: authorization-grant-role-scope-privilege-verify
    description: >
      capability.authorization.grant is a named-role grant (3-cloud: GCP IAM binding,
      AWS role-policy attachment, Azure RBAC role assignment) — the FIRST relational
      capability, composing a principal + a scope. access.scope is a closed enum
      (breadth); access.privileged is the least-privilege safety semantic. A grant
      references a NAMED role, never an inline policy (invariant #4).
    vocab:
      - capability: capability.authorization.grant
        version: 0.1
        stateful: false
        attributes:
          grant.role: { kind: string }
          grant.principal: { kind: string }
          access.scope: { kind: string, enum: [resource, account] }
          access.privileged: { kind: bool }
          service.managed: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: authz-1, environment: production, version: 1 }
      capabilities:
        - id: reader
          type: capability.authorization.grant
      constraints:
        hard:
          - id: c-role
            subject: reader
            path: grant.role
            op: equals
            value: roles/storage.objectViewer
            verify: { method: static }
          - id: c-scope
            subject: reader
            path: access.scope
            op: equals
            value: account
            verify: { method: static }
          - id: c-leastpriv
            subject: reader
            path: access.privileged
            op: equals
            value: false
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: authz-1
      capabilities:
        reader:
          attributes:
            grant.role: roles/storage.objectViewer
            grant.principal: serviceAccount:runner@acme-prod.iam.gserviceaccount.com
            access.scope: account
            access.privileged: false
            service.managed: true
    expect:
      executable: true
      verdicts:
        c-role: satisfied
        c-scope: satisfied
        c-leastpriv: satisfied

  - name: authorization-scope-enum-is-enforced
    description: >
      access.scope is a closed enum; a bogus breadth is a load error, not a silent
      pass.
    vocab:
      - capability: capability.authorization.grant
        version: 0.1
        stateful: false
        attributes:
          access.scope: { kind: string, enum: [resource, account] }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: authz-enum, environment: test, version: 1 }
      capabilities:
        - id: g
          type: capability.authorization.grant
      constraints:
        hard:
          - id: c-s
            subject: g
            path: access.scope
            op: equals
            value: resource
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: authz-enum
      capabilities:
        g:
          attributes:
            access.scope: galaxywide
    expect:
      error: candidate

  - name: authorization-role-least-privilege-verify
    description: >
