        c-private: violated

  - name: compute-instance-availability-class-enum-is-enforced
    description: >
      availability.class is a closed enum on this type: a single machine is zonal,
      and `regional` is a property of a GROUP, not of an instance. A candidate
      inventing a third value is a load error, not a silently accepted string.
    vocab:
      - capability: capability.compute.instance
        version: 0.1
        stateful: true
        attributes:
          availability.class: { kind: string, enum: [zonal, regional] }
