  - name: autoscaling-capacity-envelope-and-zone-spread-verify
    description: >
      capability.compute.autoscaling (D363). A group expresses CAPACITY where an
      instance expresses a machine — which is why replicas.minimum lives here and
      was refused on the instance type, and why `regional` is available here and
      refused there. The contract governs the ENVELOPE (never fewer than, never
      more than); the scaling policy's tuning stays out.
    vocab:
      - capability: capability.compute.autoscaling
        version: 0.1
        stateful: false
        attributes:
          availability.class: { kind: string, enum: [zonal, regional] }
          replicas.minimum: { kind: number }
          replicas.maximum: { kind: number }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: asg-1, environment: production, version: 1 }
      capabilities:
        - id: fleet
          type: capability.compute.autoscaling
      constraints:
        hard:
          - id: c-survives-zone-loss
            subject: fleet
            path: availability.class
            op: equals
            value: regional
            verify: { method: static }
          - id: c-floor
            subject: fleet
            path: replicas.minimum
            op: gte
            value: 3
            verify: { method: static }
          - id: c-ceiling
            subject: fleet
            path: replicas.maximum
            op: lte
            value: 20
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: asg-1
      capabilities:
        fleet:
          attributes:
            availability.class: regional
            replicas.minimum: 3
            replicas.maximum: 12
    expect:
      executable: true
      verdicts:
        c-survives-zone-loss: satisfied
        c-floor: satisfied
        c-ceiling: satisfied

  - name: autoscaling-floor-below-the-contract-is-violated
    description: >
      A floor of one under a contract requiring three is `violated` — the failure
      an availability requirement is written to catch, visible at verify rather
      than during the incident that finds it. A ceiling breach is the same check
      pointing the other way: it is a cost and blast-radius control.
    vocab:
      - capability: capability.compute.autoscaling
        version: 0.1
        stateful: false
        attributes:
          replicas.minimum: { kind: number }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: asg-2, environment: production, version: 1 }
      capabilities:
        - id: fleet
          type: capability.compute.autoscaling
      constraints:
        hard:
          - id: c-floor
            subject: fleet
            path: replicas.minimum
            op: gte
            value: 3
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: asg-2
      capabilities:
        fleet:
          attributes:
            replicas.minimum: 1
    expect:
      executable: false
      verdicts:
        c-floor: violated

  - name: autoscaling-replica-count-kind-mismatch-is-load-error
    description: >
      replicas.minimum is a number. A candidate supplying a scaling EXPRESSION —
      the tuning this vocabulary deliberately excludes — is a load error rather
      than a coerced value, which is what keeps a control loop out of a contract
      whose operator set is closed (invariant 4).
    vocab:
      - capability: capability.compute.autoscaling
        version: 0.1
        stateful: false
        attributes:
          replicas.minimum: { kind: number }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: asg-3, environment: test, version: 1 }
      capabilities:
        - id: fleet
          type: capability.compute.autoscaling
      constraints:
        hard:
          - id: c-floor
            subject: fleet
            path: replicas.minimum
            op: gte
            value: 3
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: asg-3
      capabilities:
        fleet:
          attributes:
            replicas.minimum: "cpu > 70% ? 5 : 2"
    expect:
      error: candidate
