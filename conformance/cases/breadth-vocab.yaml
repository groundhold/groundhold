  - name: compute-image-public-sharing-violated
    description: >
      capability.compute.image (D362). "Is our base image public?" is a question
      most estates cannot answer — it is an account setting nobody re-reads, and a
      public image is readable by strangers along with everything baked into it.
      Here it is a deterministic verdict: an image shared beyond the account
      violates a contract that forbids it, at verify.
    vocab:
      - capability: capability.compute.image
        version: 0.1
        stateful: false
        attributes:
          network.publicExposure: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: img-1, environment: production, version: 1 }
      capabilities:
        - id: base
          type: capability.compute.image
      constraints:
        hard:
          - id: c-not-public
            subject: base
            path: network.publicExposure
            op: equals
            value: false
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: img-1
      capabilities:
        base:
          attributes:
            network.publicExposure: true
    expect:
      executable: false
      verdicts:
        c-not-public: violated

  - name: compute-image-provenance-and-residency-verify
    description: >
      The image is WITNESSED, not authored (D177): groundhold does not build it,
      so every attribute arrives as an observation of what exists. Provenance is
      recorded as `inferred` from the attestation the account trusts, and the
      verdict carries that basis rather than pretending the value was declared.
    vocab:
      - capability: capability.compute.image
        version: 0.1
        stateful: false
        attributes:
          location.region: { kind: string }
          sourceProvenance: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: img-2, environment: production, version: 1 }
      capabilities:
        - id: base
          type: capability.compute.image
      constraints:
        hard:
          - id: c-eu
            subject: base
            path: location.region
            op: in
            value: [eu-central-1, europe-west1]
            verify: { method: static }
          - id: c-attested
            subject: base
            path: sourceProvenance
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: img-2
      capabilities:
        base:
          attributes:
            location.region: eu-central-1
            sourceProvenance:
              value: true
              status: inferred
              source: ami:describe-image-attribute
    expect:
      executable: true
      verdicts:
        c-eu: satisfied
        c-attested: satisfied

  - name: compute-image-provenance-kind-mismatch-is-load-error
    description: >
      sourceProvenance is declared a bool: it records THAT the build chain is
      attested, never what is inside the image. A candidate supplying the builder's
      name instead is a load error, not a coerced truthy string — otherwise "built
      by jenkins" would silently satisfy "is attested".
    vocab:
      - capability: capability.compute.image
        version: 0.1
        stateful: false
        attributes:
          sourceProvenance: { kind: bool }
    contract:
      apiVersion: contract/v0.1
      kind: InfrastructureContract
      meta: { id: img-3, environment: test, version: 1 }
      capabilities:
        - id: base
          type: capability.compute.image
      constraints:
        hard:
          - id: c-attested
            subject: base
            path: sourceProvenance
            op: equals
            value: true
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: img-3
      capabilities:
        base:
          attributes:
            sourceProvenance: "built-by-jenkins"
    expect:
