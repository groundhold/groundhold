      capabilities:
        - id: box
          type: capability.compute.instance
      constraints:
        hard:
          - id: c-private
            subject: box
            path: network.publicExposure
            op: equals
            value: false
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: vm-2
      capabilities:
        box:
          attributes:
            network.publicExposure: true
