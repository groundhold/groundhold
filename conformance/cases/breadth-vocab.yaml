          type: capability.ai.inference
      constraints:
        hard:
          - id: c-residency
            subject: llm
            path: inference.destinationRegions
            op: subset-of
            value: [eu-central-1, eu-west-1, eu-west-3, eu-north-1, eu-south-1, eu-south-2]
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: ai-1
      capabilities:
        llm:
          attributes:
            inference.destinationRegions:
