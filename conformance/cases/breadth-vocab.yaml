      capabilities:
        box:
          attributes:
            location.region: eu-central-1
            encryption.customerManagedKeys: true
            network.publicExposure: false
    expect:
      executable: true
      verdicts:
        c-eu: satisfied
        c-cmk: satisfied
        c-private: satisfied

  - name: compute-instance-public-exposure-violated
    description: >
      An instance carrying a public address under a contract that forbids one is
      `violated` at verify — the check that matters most on a VM, because a public
      IP is the difference between a private workload and an internet-facing host,
      and it is one flag away at all times.
    vocab:
