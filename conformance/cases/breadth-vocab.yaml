      kind: InfrastructureContract
      meta: { id: vol-3, environment: test, version: 1 }
      capabilities:
        - id: data
          type: capability.storage.block
      constraints:
        hard:
          - id: c-zonal
            subject: data
            path: availability.class
            op: equals
            value: zonal
            verify: { method: static }
