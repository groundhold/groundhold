            path: availability.class
            op: equals
            value: zonal
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: vm-3
      capabilities:
        box:
          attributes:
            availability.class: planet-scale
    expect:
