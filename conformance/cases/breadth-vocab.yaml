  - name: ai-inference-eu-residency-satisfied
    description: >
      capability.ai.inference (D150). The EU cross-region inference profile's
      destination regions are OBSERVED (network in observe, never in the verifier,
      #6); a profile that routes only within the EU allowlist satisfies residency
      via the existing subset-of operator — no new engine code, the D1 rule is a
      vocab attribute + a plain constraint.
    vocab:
      - capability: capability.ai.inference
        version: 0.1
        stateful: false
        attributes:
