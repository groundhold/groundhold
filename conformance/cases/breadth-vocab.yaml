      meta: { id: vol-2, environment: production, version: 1 }
      capabilities:
        - id: data
          type: capability.storage.block
      constraints:
        hard:
          - id: c-survives-zone-loss
            subject: data
            path: availability.class
            op: equals
            value: regional
            verify: { method: static }
    candidate:
      apiVersion: candidate/v0.1
      kind: ImplementationCandidate
      contract: vol-2
      capabilities:
        data:
          attributes:
            availability.class: zonal
    expect:
      executable: false
      verdicts:
        c-survives-zone-loss: violated

  - name: block-storage-availability-enum-is-enforced
    description: >
      availability.class is a closed enum. A candidate inventing a value — a disk
      TYPE, say, where a durability class belongs — is a load error rather than a
      silently accepted string, which is exactly the confusion this attribute
      exists to prevent.
    vocab:
      - capability: capability.storage.block
        version: 0.1
        stateful: true
        attributes:
          availability.class: { kind: string, enum: [zonal, regional] }
    contract:
