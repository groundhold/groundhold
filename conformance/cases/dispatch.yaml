  - name: plan-emits-autoscaling-permissions-both-clouds
    impl: go
    description: >
      A zone-spread, self-scaling fleet (capability.compute.autoscaling, D371)
      on aws/asg — the last companion around the machine, and the type that
      answers what the instance type refused: replicas.minimum is meaningless
      on one machine and is exactly what a group is for.
      The permission set says something the others do not. ec2:DescribeSubnets
      and ec2:DescribeLaunchTemplateVersions are PREFLIGHTS, not extras: a
      group's zone spread follows its subnets and its addressing follows its
      launch template, so neither availability.class nor network.publicExposure
      can be honored without reading a resource the group does not own. An
      identity that cannot make those reads cannot create a group whose
      contract is true, and the plan says so before anything is provisioned.
      autoscaling:PutScalingPolicy is attribute-conditional — a fixed-size
      fleet needs no policy and should not demand the permission to attach one.
