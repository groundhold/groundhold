      at: "2026-07-26T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: d371asg, environment: test, version: 1 }
        capabilities:
          - id: fleet
            type: capability.compute.autoscaling
        constraints:
          hard:
            - id: c-floor
              subject: fleet
              path: replicas.minimum
              op: gte
              value: 2
              verify: { method: static }
            - id: c-zone-survivable
              subject: fleet
              path: availability.class
              op: equals
              value: regional
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: d371asg
        capabilities:
          fleet:
            provider: aws
            service: asg
            attributes:
              location.region: eu-central-1
