  - name: plan-witnesses-a-machine-image-and-authors-only-the-machine
    impl: go
    description: >
      capability.compute.image on aws/ami (D370) — the first CLOUD driver that
      is a WITNESS rather than an author (D177) — alongside the machine that
      boots it. Images are BUILT, and building is a pipeline concern with its
      own review; a driver that "created" one would be a wrapper over somebody
      else's build. So the plan authors the INSTANCE and records the IMAGE as
      `witnessed`, with no action for it.
      Both halves are asserted: the absence of a create for the image, and the
      presence of the record. A case that only checked the absence would also
      pass if the capability had been dropped from the plan entirely, which is
      exactly the omission the explicit record exists to make impossible in a
      signed artifact.
      The pairing is also the realistic shape, and it is why a witness-only
      plan is refused as `nothing-to-change`: a plan exists to change things,
      and witnessing is not a change.
    plan:
      at: "2026-07-26T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: d370img, environment: test, version: 1 }
        capabilities:
          - id: base
            type: capability.compute.image
          - id: box
            type: capability.compute.instance
        constraints:
          hard:
            - id: c-image-not-public
              subject: base
              path: network.publicExposure
              op: equals
              value: false
              verify: { method: static }
            - id: c-box-region
              subject: box
              path: location.region
              op: equals
              value: eu-central-1
              verify: { method: static }
