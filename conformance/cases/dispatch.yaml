# Multi-service dispatch (D76). impl: go — the compiler is Go-only (D24).
# A plan action's requiredPermissions are now derived PER SERVICE (the API
# family that fulfils the capability) and are attribute-aware: a public Cloud
# Run service needs the IAM read-modify-write permissions a private one does
# not — omitting them would false-PASS the D75 preflight (the dangerous
# direction), including them unconditionally would false-refuse private
# deployers.

cases:
  - name: plan-emits-cloudrun-permissions-public
    impl: go
    description: >
      A public Cloud Run (workload.container) create: run.services.create/get
      + the DISTINCT run.operations.get (v2 LRO poll) + the IAM pair to grant
      allUsers the invoker role.
    plan:
      at: "2026-07-12T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: d76pub, environment: test, version: 1 }
        capabilities:
          - id: be
            type: capability.workload.container
        constraints:
          hard:
            - id: c-region
              subject: be
              path: location.region
              op: equals
              value: europe-central2
              verify: { method: static }
            - id: c-public
              subject: be
              path: network.publicExposure
              op: equals
              value: true
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: d76pub
        capabilities:
          be:
            provider: gcp
            service: cloudrun
            attributes:
              location.region: europe-central2
              network.publicExposure: true
            implementation:
              image: europe-docker.pkg.dev/x/y/be:sha
    expect:
      actions:
        a-create-be:
          operation: create
          requiredPermissions:
            - run.operations.get
            - run.services.create
            - run.services.get
            - run.services.getIamPolicy
            - run.services.setIamPolicy

  - name: plan-emits-cloudrun-permissions-private
    impl: go
    description: >
      A private Cloud Run create needs NO IAM permissions — proof the
      permission set is attribute-conditional, not a blanket over-declaration.
    plan:
      at: "2026-07-12T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: d76priv, environment: test, version: 1 }
        capabilities:
          - id: be
            type: capability.workload.container
        constraints:
          hard:
            - id: c-region
              subject: be
              path: location.region
              op: equals
              value: europe-central2
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: d76priv
        capabilities:
          be:
            provider: gcp
            service: cloudrun
            attributes:
              location.region: europe-central2
              network.publicExposure: false
            implementation:
              image: europe-docker.pkg.dev/x/y/be:sha
