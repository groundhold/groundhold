  - name: plan-emits-gcp-mig-permissions-fixed-size
    impl: go
    description: >
      The same vocabulary on gcp/mig (D371), and the case that shows the
      attribute-conditional half: a FIXED-SIZE fleet (autoscaling.enabled
      false, floor == ceiling) needs no autoscaler, so compute.autoscalers.*
      is absent from the permission set. A contract that does not ask for a
      control loop should not demand the right to attach one.
      Both operation scopes are present because a regional group is a
      different resource at a different scope than a zonal one — the same
      cross-cloud difference persistent disks showed (D368), reaching the
      permission table rather than only the URL.
    plan:
      at: "2026-07-26T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: d371mig, environment: test, version: 1 }
        capabilities:
          - id: fleet
            type: capability.compute.autoscaling
        constraints:
          hard:
            - id: c-fixed
              subject: fleet
              path: autoscaling.enabled
              op: equals
              value: false
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: d371mig
        capabilities:
          fleet:
            provider: gcp
            service: mig
            attributes:
              location.region: europe-west1
              availability.class: regional
              replicas.minimum: 3
              replicas.maximum: 3
              autoscaling.enabled: false
              service.managed: true
            implementation:
              instance_template: web-template
    expect:
      actions:
        a-create-fleet:
          operation: create
          requiredPermissions:
            - compute.instanceGroupManagers.create
            - compute.instanceGroupManagers.get
            - compute.instanceTemplates.get
            - compute.regionOperations.get
            - compute.zoneOperations.get

  - name: plan-emits-azure-vmss-permissions-authored-exposure
    impl: go
    description: >
      A self-scaling fleet on azure/azvmss (D372) — the third cloud, and the
      one where network.publicExposure is AUTHORED rather than verified. On
      AWS and GCP the fleet's machine shape lives in a separate template
      groundhold does not own, so the driver must read it and refuse when it
      contradicts the contract (D371); a scale set holds its VM profile
      INLINE, so the driver simply writes the addressing the contract asked
      for. The permission set shows it: there is no template read here, where
      both twins require one.
      Microsoft.Insights/autoscalesettings is attribute-conditional on create
      and UNCONDITIONAL on delete — a setting left behind keeps evaluating
      against a target that no longer exists.
    plan:
      at: "2026-07-26T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: d372vmss, environment: test, version: 1 }
        capabilities:
          - id: fleet
            type: capability.compute.autoscaling
        constraints:
          hard:
            - id: c-private
              subject: fleet
              path: network.publicExposure
              op: equals
              value: false
              verify: { method: static }
            - id: c-zone-survivable
              subject: fleet
              path: availability.class
              op: equals
              value: regional
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: d372vmss
        capabilities:
          fleet:
            provider: azure
            service: azvmss
            attributes:
              location.region: swedencentral
              availability.class: regional
              replicas.minimum: 2
              replicas.maximum: 10
              autoscaling.enabled: true
              network.publicExposure: false
              service.managed: true
            implementation:
              resource_group: rg
              vm_size: Standard_D2s_v5
              image_reference: Canonical:ubuntu-24_04-lts:server:latest
              subnet_id: /subscriptions/00000000-0000-0000-0000-000000000001/resourceGroups/rg/providers/Microsoft.Network/virtualNetworks/vnet/subnets/app
              admin_username: ops
              ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIabcdefghijklmnop ops@example
              zones: ["1", "2"]
              target_cpu_utilization: 60
    expect:
      actions:
        a-create-fleet:
          operation: create
          requiredPermissions:
            - Microsoft.Compute/virtualMachineScaleSets/read
            - Microsoft.Compute/virtualMachineScaleSets/write
            - Microsoft.Insights/autoscalesettings/read
            - Microsoft.Insights/autoscalesettings/write
