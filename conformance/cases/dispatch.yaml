            implementation:
              subnet_ids: [subnet-0abc123456789def0, subnet-0fed987654321cba0]
              launch_template_id: lt-0123456789abcdef0
              target_cpu_utilization: 60
    expect:
      actions:
        a-create-fleet:
          operation: create
          requiredPermissions:
            - autoscaling:CreateAutoScalingGroup
