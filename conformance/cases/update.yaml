  - name: update-without-changes-is-load-error
    description: >
      D46: an update is a reviewed change-set, never an implicit diff.
      A document case — BOTH implementations enforce it.
    document:
      apiVersion: plan/v0
      kind: SealedPlan
      plan:
        contract: u1
        environment: test
        reads:
          contractHash: "sha256:a54f0da760d75d4a3a11a271f03c78693f5166fcbbfd9b6bebb893ac8a0f36f5"
          candidateHash: "sha256:70963f22a0503d3b017f15ec8ff343dc844ec4a58fdc8900ff36979633f7e6f6"
          heads: { db: genesis }
          toolchain: { compiler: groundhold-ref/0.1, spec: contract/v0.1 }
        writes: [db]
        actions:
          - id: a-update-db
            capability: db
            operation: update
            target: fake.svc/db
            idempotencyKey: db-update-1
            risk:
