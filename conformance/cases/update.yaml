          contract: u1
          environment: test
          reads:
            contractHash: "sha256:a54f0da760d75d4a3a11a271f03c78693f5166fcbbfd9b6bebb893ac8a0f36f5"
            candidateHash: "sha256:70963f22a0503d3b017f15ec8ff343dc844ec4a58fdc8900ff36979633f7e6f6"
            heads: { db: genesis }
            toolchain: { compiler: groundhold-ref/0.1, spec: contract/v0.1 }
          writes: [db]
          actions:
            - id: a-update-db
              capability: db
              operation: update
              target: fake.svc/db
              idempotencyKey: db-update-1
              changes:
                - { path: availability.class, from: zonal, to: regional }
              risk:
                reversibility: R1
                dataLoss: none
                downtime: possible
                securityExposure: none
                costDelta: { amount: 0, currency: EUR }
                identityReplacement: false
          preconditions:
            - type: report-executable
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u1
        capabilities:
          db:
            attributes:
              availability.class: regional
    expect:
      freshPlan: true
      effects:
        a-update-db: will-update
      attributes:
        a-update-db:
          availability.class: differ

  - name: aws-s3-plan-emits-update-for-mutable-drift
    impl: go
    description: >
      D46/D86: a bound S3 bucket with fresh observations and drift in a
      MUTABLE attribute (versioning) compiles to ONE update action carrying
      exactly that path — the AWS analogue of the Cloud SQL mutable case,
      proving ClassifyChange dispatches per service.
    plan:
      at: "2026-07-11T17:05:00Z"
      bindings: { obj: "s3:eu-central-1:pv-assets-abcd1234" }
      observations:
        - { capability: obj, path: versioning.enabled, value: false,
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
      contract: &aws-s3-contract
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: s3u, environment: prod, version: 1 }
        capabilities:
          - id: obj
            type: capability.storage.object
        constraints:
          hard:
            - id: c-ver
              subject: obj
              path: versioning.enabled
              op: equals
              value: true
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: s3u
        capabilities:
          obj:
            provider: aws
            service: s3
            attributes:
              versioning.enabled: true
    expect:
      actions:
        a-update-obj:
          operation: update
          changes: [versioning.enabled]

  - name: aws-s3-plan-refuses-immutable-drift
    impl: go
    description: >
      D46/D86: region drift on an S3 bucket is create-time-only — a
