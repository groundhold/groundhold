  - name: plan-does-not-freeze-a-bound-but-blind-observer-capability
    impl: go
    description: >
      F16/F25 residual: a BOUND capability whose observer reads cleanly but
      yields ZERO observable attributes must NOT freeze the compile. The
      observation.recorded event (empty) marks it OBSERVED, so the compiler
      isolates its non-observable declared attributes as unverifiable (D249)
      rather than demanding a re-observe that can never help. Contrast the
      never-observed control below.
    plan:
      at: "2026-07-11T17:05:00Z"
      ledger:
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: lease.acquired
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T17:00:00Z"
            actor: { id: seeder, type: human }
            body: { ttlSeconds: 300 }
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: binding.updated
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T17:00:00Z"
            actor: { id: seeder, type: human }
            fencingToken: 1
            body:
              capability: db
              environment: test
              provider: { name: fake }
              resources:
                - { id: primary, type: t, providerId: "empty:db-1", generation: 1 }
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: observation.recorded
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T17:00:30Z"
            actor: { id: groundhold-observe, type: agent }
            body:
              provider: { name: fake }
              resource: { providerId: "empty:db-1" }
              observations: []
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: u-blind, environment: test, version: 1 }
        capabilities:
          - id: db
            type: capability.database.relational
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u-blind
        capabilities:
          db:
            attributes:
              availability.class: regional
    expect:
      unverified: [db]

  - name: plan-refuses-a-never-observed-bound-capability
    impl: go
    description: >
      Control for the residual fix: with NO observation.recorded event the
      capability was never observed, so re-observe IS the recoverable remedy —
      the compile still refuses observation-required. The fix narrows the freeze
      to exactly this case, it does not remove it.
    plan:
      at: "2026-07-11T17:05:00Z"
      ledger:
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: lease.acquired
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T17:00:00Z"
            actor: { id: seeder, type: human }
            body: { ttlSeconds: 300 }
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: binding.updated
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T17:00:00Z"
            actor: { id: seeder, type: human }
            fencingToken: 1
            body:
              capability: db
              environment: test
              provider: { name: fake }
              resources:
                - { id: primary, type: t, providerId: "fake:db-1", generation: 1 }
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: u-blind2, environment: test, version: 1 }
        capabilities:
          - id: db
            type: capability.database.relational
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u-blind2
        capabilities:
          db:
            attributes:
              availability.class: regional
    expect:
      error: plan
      code: observation-required

  - name: plan-advisory-attr-does-not-block-lambda-update
    impl: go
    description: >
      Acme field regression (D311): a BOUND lambda declaring an ADVISORY
      attribute (cost.monthly, evidence: projection) alongside a real mutable
      change (network.publicExposure) must still plan the update. The advisory
      attr maps to no provider setting BY DESIGN and must neither drift nor
      block. Before the fix the operand builder refused "cost.monthly has no
      Lambda mapping", the capability was isolated (D249), and the legal update
      silently collapsed to a SEALED plan with zero actions.
    plan:
      at: "2026-07-12T10:00:00Z"
      # cost.monthly must be marked evidence: projection here — the harness runs
      # with the embedded vocabulary disabled, so the projection marker (what the
      # fix keys off) only exists if the case ships it.
      vocab:
        - capability: capability.function.serverless
          version: 0.1
          stateful: false
          attributes:
            location.region: { kind: string }
            network.publicExposure: { kind: bool }
            cost.monthly: { kind: money, evidence: projection }
      bindings: { fn: "lambda:eu-central-1:123456789012:fn" }
      observations:
        - { capability: fn, path: location.region, value: "eu-central-1",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-12T09:55:00Z", ttlSeconds: 900 }
        - { capability: fn, path: network.publicExposure, value: false,
            source: provider-api, derivation: measured,
            observedAt: "2026-07-12T09:55:00Z", ttlSeconds: 900 }
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: adv1, environment: test, version: 1 }
        capabilities:
          - id: fn
            type: capability.function.serverless
        constraints:
          hard:
            - id: c-region
              subject: fn
              path: location.region
              op: equals
              value: eu-central-1
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: adv1
        capabilities:
          fn:
            provider: aws
            service: lambda
            attributes:
              location.region: eu-central-1
              network.publicExposure: true
              cost.monthly: 2 USD
            implementation:
              image_uri: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/fn:sha
              role_arn: arn:aws:iam::123456789012:role/fn-exec
    expect:
      actions:
        a-update-fn:
          operation: update
          changes: [network.publicExposure]
