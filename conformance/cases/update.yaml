  - name: gcs-plan-blocks-a-relocation-it-cannot-perform
    impl: go
    description: >
      D826: RETIRES gcs-plan-refuses-immutable-drift, which pinned "location drift on a
      GCS bucket is create-time-only — a replacement, refused at plan
      (consent-required)". That was true when it was written; Cloud Storage now publishes
      buckets.relocate (destinationLocation + destinationCustomPlacementConfig), so a
      bucket moves under its own name with its objects. The old expectation therefore
      pinned asking an operator to consent to destroying every object for a change Google
      performs in place. groundhold does not wire the relocation, so the honest outcome is
      a BLOCKED capability naming what the provider supports — never a replacement, and
      never a silent patch.
    plan:
      at: "2026-07-11T17:05:00Z"
      bindings: { obj: "gcs:acme-prod:pv-assets-abcd1234" }
      observations:
        - { capability: obj, path: location.region, value: "us",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: gcsu2, environment: prod, version: 1 }
        capabilities:
          - id: obj
            type: capability.storage.object
        constraints:
          hard:
            - id: c-region
              subject: obj
              path: location.region
              op: equals
              value: eu
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: gcsu2
        capabilities:
          obj:
            provider: gcp
            service: gcs
            attributes:
              location.region: eu
    expect:
      blocked: [obj]
