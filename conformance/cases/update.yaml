# Update end to end (D46). impl: go — single-implementation per D24.
# The compiler classifies bound capabilities against FRESH observations;
# updates carry reviewed change-sets; the executor patches in place and
# increments the binding generation.

cases:
  - name: plan-emits-update-for-mutable-drift
    impl: go
    description: >
      D46: bound + fresh observations + drift in a mutable attribute ->
      ONE update action per capability with an explicit changes list;
      converged attributes stay out of it.
    plan:
      at: "2026-07-11T17:05:00Z"
      bindings: { db: "fake:db-1" }
      observations:
        - { capability: db, path: availability.class, value: "zonal",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
        - { capability: db, path: service.managed, value: true,
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
      contract: &u-contract
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: u1, environment: test, version: 1 }
        capabilities:
          - id: db
            type: capability.database.relational
        constraints:
          hard:
            - id: c-avail
              subject: db
              path: availability.class
              op: equals
              value: regional
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u1
        capabilities:
          db:
            attributes:
              availability.class: regional
              service.managed: true
    expect:
      actions:
        a-update-db:
          operation: update
          changes: [availability.class]

  - name: plan-protocol-major-satisfied-by-observed-minor
    impl: go
    description: >
      F16-B: a bound engine.protocol declared at MAJOR granularity
      (postgresql/16) is satisfied by any observed minor of that major
      (postgresql/16.11) — no perpetual update toward a minor the operator
      never pinned. A genuinely drifted mutable attribute still updates, and
      engine.protocol stays OUT of the change-set (had it compared by equals,
      it would appear).
    plan:
      at: "2026-07-11T17:05:00Z"
      bindings: { db: "fake:db-1" }
      observations:
        - { capability: db, path: engine.protocol, value: "postgresql/16.11",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
        - { capability: db, path: availability.class, value: "zonal",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
        - { capability: db, path: service.managed, value: true,
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: u1, environment: test, version: 1 }
        capabilities:
          - id: db
            type: capability.database.relational
        constraints:
          hard:
            - id: c-avail
              subject: db
              path: availability.class
              op: equals
              value: regional
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u1
        capabilities:
          db:
            attributes:
              engine.protocol: "postgresql/16"
              availability.class: regional
              service.managed: true
    expect:
      actions:
        a-update-db:
          operation: update
          changes: [availability.class]

  - name: plan-refuses-stale-observations
    impl: go
    description: >
      D46: sealing a change-set derived from stale knowledge contradicts
      the read-set's honesty — re-observe first.
    plan:
      at: "2026-07-11T17:05:00Z"
      bindings: { db: "fake:db-1" }
      observations:
        - { capability: db, path: availability.class, value: "zonal",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T10:00:00Z", ttlSeconds: 900 }
      contract: *u-contract
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u1
        capabilities:
          db:
            attributes:
              availability.class: regional
    expect:
      error: plan
      code: observation-required

  - name: plan-refuses-immutable-drift
    impl: go
    description: >
      D46: region drift on Cloud SQL means replacement — a diagnosis, not
      a paper plan.
    plan:
      at: "2026-07-11T17:05:00Z"
      bindings: { db: "acme:europe-west1:db-x" }
      observations:
        - { capability: db, path: location.region, value: "us-east1",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: u2, environment: test, version: 1 }
        capabilities:
          - id: db
            type: capability.database.relational
        constraints:
          hard:
            - id: c-region
              subject: db
              path: location.region
              op: equals
              value: europe-west1
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u2
        capabilities:
          db:
            provider: gcp
            service: cloudsql
            attributes:
              location.region: europe-west1
    expect:
      error: plan
      code: consent-required

  - name: plan-refuses-when-converged
    impl: go
    description: D46 - converged means no plan should exist.
    plan:
      at: "2026-07-11T17:05:00Z"
      bindings: { db: "fake:db-1" }
      observations:
        - { capability: db, path: availability.class, value: "regional",
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
        - { capability: db, path: service.managed, value: true,
            source: provider-api, derivation: measured,
            observedAt: "2026-07-11T17:00:00Z", ttlSeconds: 900 }
      contract: *u-contract
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u1
        capabilities:
          db:
            attributes:
              availability.class: regional
              service.managed: true
    expect:
      error: plan
      code: nothing-to-change

  - name: apply-updates-a-bound-capability
    impl: go
    description: >
      D46: update patches in place under the same gating as create —
      write-ahead receipts, fencing, binding generation increments,
      identity survives.
    apply:
      at: "2026-07-11T14:00:00Z"
      ledger:
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: lease.acquired
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T13:00:00Z"
            actor: { id: seeder, type: human }
            body: { ttlSeconds: 3600 }
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: binding.updated
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T13:00:00Z"
            actor: { id: seeder, type: human }
            fencingToken: 1
            body:
              capability: db
              environment: test
              provider: { name: fake }
              resources:
                - { id: primary, type: t, providerId: "fake:db-1", generation: 1 }
        - apiVersion: state/v0
          kind: LedgerEvent
          event:
            type: lease.released
            environment: test
            capabilities: [db]
            occurredAt: "2026-07-11T13:00:00Z"
            actor: { id: seeder, type: human }
            fencingToken: 1
      contract: *u-contract
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: u1
        capabilities:
          db:
            attributes:
              availability.class: regional
      plan:
        apiVersion: plan/v0
        kind: SealedPlan
        plan:
          contract: u1
          environment: test
          reads:
            contractHash: "sha256:a54f0da760d75d4a3a11a271f03c78693f5166fcbbfd9b6bebb893ac8a0f36f5"
            candidateHash: "sha256:70963f22a0503d3b017f15ec8ff343dc844ec4a58fdc8900ff36979633f7e6f6"
            heads: { db: "sha256:4fcc19a6147159f4133d849e9b4e984013507e4239c4cb2a13fad50254d97ff2" }
            toolchain: { compiler: groundhold-ref/0.1, spec: contract/v0.1 }
          writes: [db]
          actions:
            - id: a-update-db
              capability: db
              operation: update
              target: fake.svc/db
              idempotencyKey: db-update-1
              changes:
                - { path: availability.class, from: zonal, to: regional }
              risk:
                reversibility: R1
                dataLoss: none
                downtime: possible
                securityExposure: none
                costDelta: { amount: 0, currency: EUR }
                identityReplacement: false
          preconditions:
            - type: report-executable
    expect:
      exit: 0
      status: applied
      events: [lease.acquired, apply.started, operation.receipt,
               binding.updated, operation.receipt, apply.finished,
               lease.released]
      bindings: { db: "fake:db-1" }

  - name: forecast-will-update
