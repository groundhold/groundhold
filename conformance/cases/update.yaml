  - name: gitops-witness-capability-is-not-authored
    impl: go
    description: >
      D177: author-vs-witness in the plan. A candidate binding an observe-only k8s
      WITNESS (a GitOps controller Application — no write lens) plans NO create for
      it: groundhold verifies it, never authors it. The authored Pod Identity coupling
      alongside DOES get a create. The witness is recorded in the plan's `witnessed`
      block instead (an explicit fact, not silence).
    plan:
      at: "2026-07-19T10:00:00Z"
      contract:
        apiVersion: contract/v0.1
        kind: InfrastructureContract
        meta: { id: gw1, environment: production, version: 1 }
        capabilities:
          - id: repo-identity
            type: capability.identity.podidentity
          - id: gitops-root
            type: capability.gitops.application
        constraints:
          hard:
            - id: c-ns
              subject: repo-identity
              path: workload.namespace
              op: equals
              value: argocd
              verify: { method: static }
            - id: c-synced
              subject: gitops-root
              path: sync.status
              op: equals
              value: synced
              verify: { method: static }
      candidate:
        apiVersion: candidate/v0.1
        kind: ImplementationCandidate
        contract: gw1
        capabilities:
          repo-identity:
            provider: aws
            service: eks-podidentity
            attributes:
              workload.namespace: argocd
              workload.serviceAccount: argocd-repo-server
              service.managed: true
            implementation:
              clusterName: acme-eks
              roleArn: "arn:aws:iam::000000000000:role/r"
          gitops-root:
            provider: k8s
            service: argocd-application
            attributes:
              sync.status: synced
    expect:
      actions:
        a-create-repo-identity:
          operation: create
      absentActions:
        - a-create-gitops-root

  - name: aws-dns-record-plan-emits-update-for-repoint
    impl: go
    description: >
      D263: repointing a bound Route 53 record (dns.target drift) compiles to ONE
      update action carrying exactly dns.target — an UPSERT in place, never a
      delete+recreate resolution gap.
    plan:
      at: "2026-07-23T10:00:00Z"
      bindings: { connect: "r53rec:Z123ABC:CNAME:connect.example.com." }
      observations:
