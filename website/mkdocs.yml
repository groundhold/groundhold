site_name: Groundhold
site_url: https://groundhold.dev/
site_description: >
  AI should not write Terraform. It should emit verifiable contracts —
  and a deterministic runtime should validate, gate, execute and prove
  them.
docs_dir: pages
# The landing page's <title>. Material falls back to site_name alone there, which
# spends the most valuable line in a search result on a word nobody searches for.
extra:
  homepage_title: >-
    Groundhold — verify what is actually true about your cloud
theme:
  name: material
  custom_dir: overrides
  logo: img/logo-mark.svg
  favicon: img/favicon.ico
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: dark }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: light }
  features: [navigation.sections, content.code.copy]
nav:
  - What is Groundhold: index.md
  - Why Groundhold: why.md
  - The honesty rules: honesty.md
  - Quickstart: quickstart.md
  - Reading the output: presentation.md
  - The conformance suite: conformance.md
  - CLI reference: cli.md
  - Errors and exit codes: errors.md
  - MCP server: mcp.md
  - Providers and drivers: drivers.md
  - Extending groundhold (dev guide): extending.md
  - Versioning and licenses: versioning.md
  - 'Field note: when one page is enough': paging.md
  - 'Field note: every check passed, no alarm could reach a human': dead-channel.md
  - 'Field note: six ways our own documentation lied': unrun.md
# Markdown under docs_dir is BUILT whether or not anyone navigates to it. These are
# working notes that live beside the assets they describe; they are not pages, and
# publishing them was a decision nobody made. Anything here is deliberately withheld —
# the gate requires every other page to be reachable from nav.
exclude_docs: |
  img/README.md
markdown_extensions: [admonition, pymdownx.superfences, tables]
